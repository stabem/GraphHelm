name: Foundation Graph Kernel CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.97.1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Verify formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Deny Clippy warnings
        run: cargo +1.97.1 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests
        run: cargo +1.97.1 test --workspace --all-features --locked
      - name: Run CLI acceptance tests
        run: cargo +1.97.1 test -p graphhelm-cli --test cli_smoke --locked
      - name: Verify locked workspace metadata
        run: cargo +1.97.1 metadata --locked --no-deps --format-version 1
