schema: graphhelm.journey-flow/1
id: keel-watchdog-routing
title: A Keel verdict routes the task
purpose: "A blocked Keel check routes the task back to implement with its finding, and a corrected head advances it to review."
status: draft
approved: null
base: http://127.0.0.1:1
actors: [owner]
secrets: []
risks: []
screens:
  - id: routing-report
    title: "The blocked check routes back, the corrected check advances to review"
    url: /report
    state: stable
    expect: [{role: exit, name: "0", because: scenario.py exits 0 only when both routes happened as expected}, {role: stdout, name: keel.scope.path_outside_card, because: "the blocked diff touches a path outside the card, so the finding is keel.scope.path_outside_card"}, {role: stdout, name: "\"afterBlocked\": {\"route-correction\": \"ready\", \"route-review\": null}", because: "after the blocked check's implement draft is approved, execution status shows route-correction ready and no route-review node, so the task went back to implement and not on to review"}, {role: stdout, name: "\"afterCorrected\": {\"route-review\": \"ready\"}", because: "after the corrected head passes and its review draft is approved, execution status shows route-review ready"}]
    scope: unknown
  - id: task-started
    title: A task starts with a scoped card
    url: /task
    state: stable
    expect: [{role: exit, name: "0", because: "the run has started and no command has run yet, which is all a start screen of commands can show"}, {role: stdout, name: route-correction, absent: true, because: "no command has run yet, so nothing has routed the task: no route-correction node is shown"}]
    scope: unknown
edges:
  - id: route-by-verdict
    from: task-started
    to: routing-report
    why: "A blocked Keel check sends the task back to implement with its finding, and a corrected head moves it on to review."
    acts:
      - {kind: cli, role: exec, name: python .graphhelm/fixtures/keel-watchdog-routing/scenario.py}
paths:
  main: [route-by-verdict]
drift: []
