schema: graphhelm.journey-flow/1
id: studio-answer-node
title: Answer a step that is waiting for you
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [irreversible_effect, ambiguous_behavior]
viewport: {width: 720, height: 900}
screens:
  - id: mission
    title: The mobile navigation opens first
    url: /?session=studio-fixture
    state: stable
    expect: [{role: tablist, name: Studio columns}, {role: tab, name: Team}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx]
  - id: node
    title: "The waiting step's window, with the Answer box"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: heading, name: This node is waiting for you}, {role: textbox, name: Kind of proof}, {role: button, name: Answer with no evidence}]
    scope: [apps/studio/src/components/panel.tsx, apps/studio/src/components/answer.tsx, apps/studio/src/runtime/client.ts]
  - id: released
    title: Your answer is signed and the step moves on
    url: /?session=studio-fixture
    state: success
    expect: [{role: button, name: Nothing needs you}]
    scope: [apps/studio/src/components/answer.tsx, apps/studio/src/components/beacon.tsx, apps/studio/src/runtime/client.ts]
  - id: run
    title: "A run is open, with its chat and its team on screen"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: button, name: Deploy · waiting input}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/beacon.tsx, apps/studio/src/runtime/needs-you.ts]
edges:
  - id: mission.team
    from: mission
    to: run
    acts:
      - {kind: activate, role: tab, name: Team}
  - id: node.answer
    from: node
    to: released
    acts:
      - {kind: enter_text, role: textbox, name: Kind of proof, text: test_report}
      - {kind: activate, role: button, name: Answer with no evidence}
  - id: run.waiting-step
    from: run
    to: node
    acts:
      - {kind: activate, role: button, name: Deploy · waiting input}
paths:
  main: [mission.team, run.waiting-step, node.answer]
drift: []
