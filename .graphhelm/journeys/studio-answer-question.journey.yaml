schema: graphhelm.journey-flow/1
id: studio-answer-question
title: Answer an agent from the run panel
purpose: The owner answers a waiting agent from the run panel and the run continues with that answer.
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, ambiguous_behavior]
screens:
  - id: answering
    title: The run panel addresses the asking agent
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: textbox, name: Say something into this run}, {role: button, name: send}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/panel.tsx]
  - id: asked
    title: The pending question is shown in the run panel
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Needs you}, {role: heading, name: planner asks}, {role: button, name: Answer}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/beacon.tsx, apps/studio/src/runtime/needs-you.ts]
  - id: run
    title: A run has a question for the owner
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: button, name: 2 decisions need you}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/beacon.tsx]
edges:
  - id: asked.answering
    from: asked
    to: answering
    acts:
      - {kind: activate, role: button, name: Answer}
  - id: run.asked
    from: run
    to: asked
    acts:
      - {kind: activate, role: button, name: 2 decisions need you}
paths:
  main: [run.asked, asked.answering]
drift: []
