schema: graphhelm.journey-flow/1
id: studio-answer-question
title: Answer a question an agent asked
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, ambiguous_behavior]
screens:
  - id: answered
    title: Your answer is saved and the question is settled
    url: /?session=studio-fixture
    state: success
    expect: [{role: tabpanel, name: planner}, {role: textbox, name: Message}]
    scope: [apps/studio/src/components/beacon.tsx, apps/studio/src/runtime/needs-you.ts, apps/studio/src/graph/ledger.ts, apps/studio/src/components/chat-column.tsx, apps/studio/src/runtime/client.ts]
  - id: answering
    title: "A private chat with the agent who asked, ready for your answer"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: button, name: Clear}, {role: textbox, name: Message}, {role: button, name: Send}]
    scope: [apps/studio/src/components/chat-column.tsx, apps/studio/src/runtime/threads.ts]
  - id: asked
    title: "A question is waiting under Needs you (demo: asked by planner)"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: Needs you}, {role: heading, name: planner asks}, {role: button, name: Answer}, {role: button, name: Refuse}]
    scope: [apps/studio/src/components/beacon.tsx, apps/studio/src/runtime/needs-you.ts, apps/studio/src/graph/ledger.ts, apps/studio/src/components/chat-column.tsx]
edges:
  - id: answering.send
    from: answering
    to: answered
    acts:
      - {kind: enter_text, role: textbox, name: Message, text: "Staging first, then production."}
      - {kind: activate, role: button, name: Send}
  - id: asked.answer
    from: asked
    to: answering
    acts:
      - {kind: activate, role: button, name: Answer}
paths:
  main: [asked.answer, answering.send]
drift: []
