schema: graphhelm.journey-flow/1
id: studio-approve-reject
title: "See a rejected journey and its note, then open Reject next to Approve"
purpose: "The owner sees which journey was rejected and why, with the note shown as text, and can reject from the same place they approve."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, security]
screens:
  - id: proof
    title: The Proof list marks the rejected journey
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Proof}, {role: button, name: "Read While you were away, follow its goal, evidence and duties, and dismiss it 0/3"}]
    scope: [apps/studio/src/components/mission-view.tsx, apps/studio/src/runtime/use-journeys.ts, apps/studio/src/runtime/client.ts]
  - id: reject
    title: Reject opens a note box that sends nothing until the owner writes a reason
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: textbox, name: Why reject}, {role: button, name: Send reject}, {role: button, name: Cancel}]
    scope: [apps/studio/src/components/proof-table.tsx]
  - id: rejected
    title: "The rejected journey shows its note as text, with Approve and Reject"
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: note, name: "Rejected: <b>no</b> receipt & no total"}, {role: button, name: Approve}, {role: button, name: Reject}]
    scope: [apps/studio/src/components/proof-table.tsx]
  - id: run
    title: A run is open on its Mission graph
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: tablist, name: Mission views}, {role: tab, name: Proof}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx]
edges:
  - id: proof.rejected
    from: proof
    to: rejected
    acts:
      - {kind: activate, role: button, name: "Read While you were away, follow its goal, evidence and duties, and dismiss it 0/3"}
  - id: rejected.reject
    from: rejected
    to: reject
    acts:
      - {kind: activate, role: button, name: Reject}
  - id: run.proof
    from: run
    to: proof
    acts:
      - {kind: activate, role: tab, name: Proof}
paths:
  main: [run.proof, proof.rejected, rejected.reject]
drift: []
