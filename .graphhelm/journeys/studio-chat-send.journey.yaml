schema: graphhelm.journey-flow/1
id: studio-chat-send
title: Read the team chat and message everyone
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: chat
    title: "The chat, on the Everyone thread"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: complementary, name: Chat}, {role: tablist, name: Threads}, {role: tab, name: Everyone}, {role: textbox, name: Message}, {role: button, name: Send}]
    scope: [apps/studio/src/components/chat-column.tsx, apps/studio/src/runtime/threads.ts, apps/studio/src/runtime/client.ts, apps/studio/src/graph/ledger.ts]
  - id: chat.sent
    title: Your message shows in the Everyone thread
    url: /?session=studio-fixture
    state: success
    expect: [{role: complementary, name: Chat}, {role: tabpanel, name: Everyone}, {role: textbox, name: Message}]
    scope: [apps/studio/src/components/chat-column.tsx, apps/studio/src/runtime/threads.ts, apps/studio/src/runtime/client.ts, apps/studio/src/graph/ledger.ts]
  - id: mission
    title: Open the chat from the mission
    url: /?session=studio-fixture
    state: stable
    expect: [{role: group, name: Go to}, {role: button, name: Chat}]
    scope: [apps/studio/src/components/mission-view.tsx]
edges:
  - id: chat.send
    from: chat
    to: chat.sent
    acts:
      - {kind: activate, role: tab, name: Everyone}
      - {kind: enter_text, role: textbox, name: Message, text: "Hello team, please report your status."}
      - {kind: activate, role: button, name: Send}
  - id: mission.chat
    from: mission
    to: chat
    acts:
      - {kind: activate, role: button, name: Chat}
paths:
  main: [mission.chat, chat.send]
drift: []
