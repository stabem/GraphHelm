schema: graphhelm.journey-flow/1
id: studio-connect-existing-chat
title: Open the existing chat picker from Chat
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [security, multiple_components]
screens:
  - id: mission
    title: A run is open on its Mission graph
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: Canvas}, {role: button, name: Chat}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx]
  - id: native
    title: "The step's window, with Connect existing chat open"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: Connect existing chat}, {role: heading, name: Connect existing chat}, {role: textbox, name: Search chats}]
    scope: [apps/studio/src/components/panel.tsx, apps/studio/src/components/native-chats.tsx, apps/studio/src/runtime/client.ts]
  - id: run
    title: The Chat panel offers an existing coordinator chat
    url: /?session=studio-fixture
    state: stable
    expect: [{role: complementary, name: Chat}, {role: region, name: Main chat}, {role: heading, name: Main chat}, {role: button, name: Connect existing chat}]
    scope: [apps/studio/src/components/main-chat.tsx]
edges:
  - id: mission.chat
    from: mission
    to: run
    acts:
      - {kind: activate, role: button, name: Chat}
  - id: run.connect-chat
    from: run
    to: native
    acts:
      - {kind: activate, role: button, name: Connect existing chat}
paths:
  main: [mission.chat, run.connect-chat]
drift: []
