schema: graphhelm.journey-flow/1
id: studio-connect
title: Connect the Studio with the access token
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: [studio_token]
risks: [authentication, security]
screens:
  - id: gate
    title: The connect screen
    url: /
    state: empty
    expect: [{role: heading, name: Your agents are one token away}, {role: textbox, name: Bearer token}, {role: button, name: Connect}]
    scope: [apps/studio/src/components/Connect.tsx, apps/studio/src/runtime/session.ts]
  - id: run
    title: The connected Studio opens the run's Mission view
    url: /
    state: stable
    expect: [{role: navigation, name: Projects}, {role: tablist, name: Mission views}, {role: tab, name: Graph}, {role: button, name: Run actions}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/rail.tsx, apps/studio/src/components/mission-view.tsx, apps/studio/src/runtime/client.ts]
edges:
  - id: gate.connect
    from: gate
    to: run
    acts:
      - {kind: enter_text, role: textbox, name: Bearer token, secret: studio_token}
      - {kind: submit, role: button, name: Connect}
paths:
  main: [gate.connect]
drift: []
