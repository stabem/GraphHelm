schema: graphhelm.journey-flow/1
id: studio-conversation-panel
title: Open the Conversation panel and say something
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: conversation
    title: "The Conversation panel, with the box to type in"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: Run demo}, {role: heading, name: Conversation}, {role: button, name: Close this panel}, {role: region, name: Shared conversation}, {role: textbox, name: Say something into this run}, {role: button, name: send}]
    scope: [apps/studio/src/components/panel.tsx, apps/studio/src/runtime/work-conversation.ts]
  - id: run
    title: "A run is open, with its chat and its team on screen"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: button, name: Toggle conversation}, {role: region, name: Canvas}]
    scope: [apps/studio/src/App.tsx]
  - id: said
    title: Your line shows in the shared conversation
    url: /?session=studio-fixture
    state: success
    expect: [{role: region, name: Shared conversation}, {role: textbox, name: Say something into this run}]
    scope: [apps/studio/src/components/panel.tsx, apps/studio/src/runtime/client.ts]
edges:
  - id: conversation.say
    from: conversation
    to: said
    acts:
      - {kind: enter_text, role: textbox, name: Say something into this run, text: "Keep going, I am watching."}
      - {kind: activate, role: button, name: send}
  - id: run.conversation
    from: run
    to: conversation
    acts:
      - {kind: activate, role: button, name: Toggle conversation}
paths:
  main: [run.conversation, conversation.say]
drift: []
