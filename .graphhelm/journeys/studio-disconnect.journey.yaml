schema: graphhelm.journey-flow/1
id: studio-disconnect
title: "Owner disconnects: two separate clicks, then the connect gate"
status: approved
approved: {revision: 7b09242430064c3cd3dd4b89ed61d75981326e0c, digest: sha256:981e015a35b7f0a4c461cc7a8107cc58db7dd9287f32db3893a626f4aa00ec4d}
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [irreversible_effect, authentication]
screens:
  - id: armed
    title: Disconnect is armed for five seconds
    url: /?session=studio-fixture
    state: stable
    expect: [{role: button, name: Click again to disconnect and clear the boards}]
    scope: [apps/studio/src/App.tsx]
  - id: gate
    title: Connect gate
    url: /?session=studio-fixture
    state: empty
    expect: [{role: heading, name: Your agents are one token away}, {role: button, name: Connect}]
    scope: [apps/studio/src/components/Connect.tsx, apps/studio/src/App.tsx]
  - id: run
    title: "A run is open: rail, chat, team canvas, side panel"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: button, name: Disconnect}, {role: navigation, name: Projects}]
    scope: [apps/studio/src/App.tsx]
edges:
  - id: armed.confirm
    from: armed
    to: gate
    acts:
      - {kind: activate, role: button, name: Click again to disconnect and clear the boards}
  - id: run.disconnect
    from: run
    to: armed
    acts:
      - {kind: activate, role: button, name: Disconnect}
paths:
  main: [run.disconnect, armed.confirm]
drift: []
