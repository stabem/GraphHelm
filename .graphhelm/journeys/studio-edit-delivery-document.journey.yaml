schema: graphhelm.journey-flow/1
id: studio-edit-delivery-document
title: "Edit a delivered document and save it (draft: the test setup has no delivered text document)"
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [irreversible_effect, external_delivery]
screens:
  - id: editor
    title: The document editor
    url: /?session=studio-fixture
    state: stable
    expect: [{role: complementary, name: Project document editor}, {role: textbox, name: File content}, {role: textbox, name: Why are you changing this?}, {role: button, name: Save project file}, {role: button, name: Close document editor}]
    scope: [apps/studio/src/components/document-editor.tsx, apps/studio/src/runtime/client.ts]
  - id: node
    title: "The step's window, with what it delivered"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: Deliveries}, {role: heading, name: Deliveries}, {role: button, name: Close this node}]
    scope: [apps/studio/src/components/panel.tsx, apps/studio/src/components/deliveries.tsx, apps/studio/src/runtime/client.ts]
  - id: saved
    title: The file is saved in the project folder and the change is noted
    url: /?session=studio-fixture
    state: success
    expect: [{role: status, name: Saved to main project folder}]
    scope: [apps/studio/src/components/document-editor.tsx, apps/studio/src/runtime/client.ts]
edges:
  - id: editor.save
    from: editor
    to: saved
    acts:
      - {kind: enter_text, role: textbox, name: File content, text: "# Release notes: version 0.2"}
      - {kind: enter_text, role: textbox, name: Why are you changing this?, text: Fix the version header.}
      - {kind: activate, role: button, name: Save project file}
  - id: node.open-document
    from: node
    to: editor
    acts:
      - {kind: activate, role: button, name: Release notes docs/RELEASE_NOTES.md}
paths:
  main: [node.open-document, editor.save]
drift: []
