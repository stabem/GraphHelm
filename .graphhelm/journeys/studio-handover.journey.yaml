schema: graphhelm.journey-flow/1
id: studio-handover
title: Read While you were away and dismiss it
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
viewport: {width: 768, height: 844}
storage: [{key: graphhelm.handover.last-seen:demo:demo, value: "{\"sequence\":1,\"at\":1791602399034}"}]
screens:
  - id: details
    title: The handover details cite what happened while away
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: While you were away}, {role: heading, name: Shipped}, {role: heading, name: Went quiet}, {role: heading, name: Nobody touched}, {role: button, name: Got it}]
    scope: [apps/studio/src/components/handover-card.tsx, apps/studio/src/runtime/handover.ts]
  - id: entry
    title: Open the Team column to read the handover
    url: /?session=studio-fixture
    state: stable
    expect: [{role: tablist, name: Studio columns}, {role: tab, name: Team}]
    scope: [apps/studio/src/App.tsx]
  - id: handover
    title: The While you were away card (shows after 15+ minutes and 20+ events away)
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: While you were away}, {role: button, name: Show details}, {role: button, name: Got it}]
    scope: [apps/studio/src/components/handover-card.tsx, apps/studio/src/runtime/handover.ts]
  - id: run
    title: The run remains open after dismissing the handover
    url: /?session=studio-fixture
    state: stable
    expect: [{role: tablist, name: Canvas views}, {role: tab, name: Team (live)}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/handover-card.tsx]
edges:
  - id: entry.handover
    from: entry
    to: handover
    acts:
      - {kind: activate, role: tab, name: Team}
  - id: handover.details
    from: handover
    to: details
    acts:
      - {kind: activate, role: button, name: Show details}
  - id: handover.dismiss
    from: details
    to: run
    acts:
      - {kind: activate, role: button, name: Got it}
paths:
  main: [entry.handover, handover.details, handover.dismiss]
drift: []
