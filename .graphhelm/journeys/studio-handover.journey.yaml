schema: graphhelm.journey-flow/1
id: studio-handover
title: "Read While you were away, follow its goal, evidence and duties, and dismiss it"
purpose: "The owner returns, reads what happened while away, sees the task goal, follows one cited evidence record, sees the open duties, and dismisses the summary."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
viewport: {width: 768, height: 844}
storage: [{key: graphhelm.handover.last-seen:demo:demo, value: "{\"sequence\":1,\"at\":1791602399034}"}]
screens:
  - id: details
    title: The handover details cite what happened while away
    url: /?session=studio-fixture&run=:run
    state: stable
    expect: [{role: region, name: While you were away}, {role: heading, name: Shipped}, {role: heading, name: Went quiet}, {role: heading, name: Nobody touched}, {role: heading, name: Goal}, {role: link, name: Cited evidence}, {role: heading, name: Open duties}, {role: button, name: Got it}]
    scope: [apps/studio/src/components/handover-card.tsx, apps/studio/src/runtime/handover.ts]
  - id: handover
    title: The owner lands on the Graph canvas and the While you were away bar is there (after 15+ minutes and 20+ events away)
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: tablist, name: Mission views}, {role: region, name: While you were away}, {role: button, name: Show details}, {role: button, name: Got it}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/handover-card.tsx, apps/studio/src/components/mission-view.tsx, apps/studio/src/runtime/handover.ts]
  - id: run
    title: Back on the Graph canvas after dismissing the handover
    url: /?session=studio-fixture&run=:run
    state: stable
    expect: [{role: tablist, name: Mission views}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/handover-card.tsx, apps/studio/src/components/mission-view.tsx]
edges:
  - id: handover.details
    from: handover
    to: details
    acts:
      - {kind: activate, role: button, name: Show details}
  - id: handover.dismiss
    from: details
    to: run
    acts:
      - {kind: activate, role: button, name: Got it}
paths:
  main: [handover.details, handover.dismiss]
drift: []
