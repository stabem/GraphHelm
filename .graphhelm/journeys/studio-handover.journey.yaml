schema: graphhelm.journey-flow/1
id: studio-handover
title: "Read While you were away and dismiss it (draft: the replay cannot set when you were last here)"
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: handover
    title: The While you were away card (shows after 15+ minutes and 20+ events away)
    url: /?session=studio-fixture
    state: stable
    expect: [{role: dialog, name: While you were away}, {role: heading, name: Shipped}, {role: heading, name: Went quiet}, {role: heading, name: Nobody touched}, {role: button, name: Got it}]
    scope: [apps/studio/src/components/handover-card.tsx, apps/studio/src/runtime/handover.ts]
  - id: run
    title: "A run is open, with its chat and its team on screen"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: navigation, name: Projects}, {role: region, name: Canvas}, {role: tab, name: Team (live)}, {role: region, name: Team}, {role: complementary, name: Run side panel}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/rail.tsx, apps/studio/src/components/team-canvas.tsx, apps/studio/src/components/right-panel.tsx]
edges:
  - id: handover.dismiss
    from: handover
    to: run
    acts:
      - {kind: activate, role: button, name: Got it}
paths:
  main: [handover.dismiss]
drift: []
