schema: graphhelm.journey-flow/1
id: studio-journey-tab
title: Review the promise beside the observer that recorded it
purpose: "The owner opens a journey's Proof and sees its promise beside the Observer and evidence section, which names the runner that recorded the shown run (#1672)."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: observed
    title: The recorded journey names the runner that observed it
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: heading, name: Observer and evidence}, {role: note, name: Observed by journey-preview-runner}]
    scope: [apps/studio/src/components/proof-table.tsx, apps/studio/src/runtime/types.ts, apps/cli/src/commands/journey_preview.rs]
  - id: proof
    title: Review the promise and named observer evidence before deciding
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Proof}, {role: navigation, name: Journeys}, {role: heading, name: Promise}, {role: heading, name: Observer and evidence}, {role: group, name: Journey actions}, {role: button, name: Approve}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx, apps/studio/src/components/proof-table.tsx]
  - id: run
    title: A run is open on its Mission graph
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Canvas}, {role: tablist, name: Mission views}, {role: tab, name: Proof}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx]
edges:
  - id: proof.observed
    from: proof
    to: observed
    acts:
      - {kind: activate, role: button, name: Read the Runtime health 0/2}
  - id: run.proof
    from: run
    to: proof
    acts:
      - {kind: activate, role: tab, name: Proof}
paths:
  main: [run.proof, proof.observed]
drift: []
