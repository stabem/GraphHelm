schema: graphhelm.journey-flow/1
id: studio-journey-tab
title: Open the Journey tab of a run
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: journey
    title: The Journey tab (empty until a journey has screenshots)
    url: /?session=studio-fixture
    state: empty
    expect: [{role: tab, name: Journey}, {role: tabpanel, name: Journeys}, {role: region, name: Journey flows}, {role: heading, name: Journeys to approve}]
    scope: [apps/studio/src/components/journey-canvas.tsx, apps/studio/src/components/right-panel.tsx, apps/studio/src/runtime/journeys.ts]
  - id: run
    title: "A run is open, with its chat and its team on screen"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: tablist, name: Canvas views}, {role: tab, name: Team (live)}, {role: tab, name: Journey}, {role: tabpanel, name: Team}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/rail.tsx, apps/studio/src/components/team-canvas.tsx, apps/studio/src/components/right-panel.tsx]
edges:
  - id: run.journey
    from: run
    to: journey
    acts:
      - {kind: activate, role: tab, name: Journey}
paths:
  main: [run.journey]
drift: []
