schema: graphhelm.journey-flow/1
id: studio-journey-tab
title: "Review the promise and observer evidence (OBSERVER_MISSING: https://github.com/stabem/GraphHelm/issues/1041#issuecomment-6144841351; #1042)"
purpose: The owner reviews a journey promise next to the observer evidence that proves it.
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: proof
    title: Review the promise and named observer evidence before deciding
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Proof}, {role: navigation, name: Journeys}, {role: heading, name: Promise}, {role: heading, name: Observer and evidence}, {role: group, name: Journey actions}, {role: button, name: Approve}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx, apps/studio/src/components/proof-table.tsx]
  - id: run
    title: A run is open on its Mission graph
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Canvas}, {role: tablist, name: Mission views}, {role: tab, name: Proof}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx]
edges:
  - id: run.proof
    from: run
    to: proof
    acts:
      - {kind: activate, role: tab, name: Proof}
paths:
  main: [run.proof]
drift: []
