schema: graphhelm.journey-flow/1
id: studio-journey-tab
title: Owner opens the Journey tab of a run
status: approved
approved: {revision: 7b09242430064c3cd3dd4b89ed61d75981326e0c, digest: sha256:47aee956462ce49c6ba5283b9f65fc6e598920b7806a2929df947f20053dd1e2}
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: journey
    title: Journey canvas (empty until a contract has captures)
    url: /?session=studio-fixture
    state: empty
    expect: [{role: region, name: Journey}, {role: tab, name: Journey}, {role: region, name: Journeys}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/journey-canvas.tsx, apps/studio/src/components/right-panel.tsx, apps/studio/src/runtime/journeys.ts]
  - id: run
    title: "A run is open: rail, chat, team canvas, side panel"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: tablist, name: Canvas views}, {role: tab, name: Team (live)}, {role: tab, name: Journey}, {role: region, name: Journeys}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/rail.tsx, apps/studio/src/components/team-canvas.tsx, apps/studio/src/components/right-panel.tsx, apps/studio/src/runtime/client.ts]
edges:
  - id: run.journey
    from: run
    to: journey
    acts:
      - {kind: activate, role: tab, name: Journey}
paths:
  main: [run.journey]
drift: []
