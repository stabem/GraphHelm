schema: graphhelm.journey-flow/1
id: studio-journey-tab
title: Open the Proof tab and see the observer note of a recorded run
purpose: "The owner opens the Proof tab of a run (Mission views), sees the Proof region with its Journeys list, the Promise and Observer and evidence headings and the Approve action, and, after choosing a journey with a recorded preview, an observer note reading Observed by journey-preview-runner. It does not claim which runner or version the note names. The recorded journey is the fixture-only runtime-health seed."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: observed
    title: A journey with a recorded preview shows its observer note
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: heading, name: Observer and evidence}, {role: note, name: Observed by journey-preview-runner}]
    scope: [apps/studio/src/components/proof-table.tsx, apps/studio/src/runtime/types.ts, apps/cli/src/commands/journey_preview.rs]
  - id: proof
    title: "The Proof view shows the promise, the observer section and the Approve action"
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Proof}, {role: navigation, name: Journeys}, {role: heading, name: Promise}, {role: heading, name: Observer and evidence}, {role: group, name: Journey actions}, {role: button, name: Approve}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx, apps/studio/src/components/proof-table.tsx]
  - id: run
    title: A run is open with its Mission views
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Canvas}, {role: tablist, name: Mission views}, {role: tab, name: Proof}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx]
edges:
  - id: proof.observed
    from: proof
    to: observed
    acts:
      - {kind: activate, role: button, name: Read the Runtime health 0/2}
  - id: run.proof
    from: run
    to: proof
    acts:
      - {kind: activate, role: tab, name: Proof}
paths:
  main: [run.proof, proof.observed]
drift: []
