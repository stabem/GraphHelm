schema: graphhelm.journey-flow/1
id: studio-lanes-board
title: See what each working lane is doing
purpose: "The owner sees, on each working lane's card, its task step and the build it holds (#1556)."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, accessibility]
viewport: {width: 1440, height: 900}
screens:
  - id: agents
    title: The Agents board counts one working lane
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Agents}, {role: button, name: Working 1}, {role: region, name: Build slots}]
    scope: [apps/studio/src/components/lanes-timeline.tsx]
  - id: run
    title: The Lanes view is available
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: tablist, name: Mission views}, {role: tab, name: Lanes}]
    scope: [apps/studio/src/components/mission-view.tsx]
  - id: working
    title: The working lane's card names its step and the build it holds
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: list, name: Agent board}, {role: listitem, name: planner · Building · proving · lanes-fixture}]
    scope: [apps/studio/src/components/lanes-timeline.tsx, apps/studio/src/runtime/agent-board.ts]
edges:
  - id: agents.working
    from: agents
    to: working
    acts:
      - {kind: activate, role: button, name: Working 1}
  - id: run.agents
    from: run
    to: agents
    acts:
      - {kind: activate, role: tab, name: Lanes}
paths:
  main: [run.agents, agents.working]
drift: []
