schema: graphhelm.journey-flow/1
id: studio-mobile
title: "On a phone, switch between Chat, Team and Journeys (draft: the journey cannot ask for a phone-sized screen)"
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [accessibility, critical_ux]
screens:
  - id: chat
    title: "On a phone: the Chat tab"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: tablist, name: Studio columns}, {role: complementary, name: Chat}, {role: textbox, name: Message}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/styles.css, apps/studio/src/dock-reserve.ts, apps/studio/src/components/chat-column.tsx]
  - id: journeys
    title: "On a phone: the Journeys tab"
    url: /?session=studio-fixture
    state: empty
    expect: [{role: tablist, name: Studio columns}, {role: region, name: Journey}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/styles.css, apps/studio/src/dock-reserve.ts, apps/studio/src/components/journey-canvas.tsx]
  - id: team
    title: "On a phone: the Team tab (shown first)"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: tablist, name: Studio columns}, {role: tab, name: Chat}, {role: tab, name: Team}, {role: tab, name: Journeys}, {role: region, name: Team}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/styles.css, apps/studio/src/dock-reserve.ts, apps/studio/src/components/team-canvas.tsx]
edges:
  - id: chat.journeys
    from: chat
    to: journeys
    acts:
      - {kind: activate, role: tab, name: Journeys}
  - id: team.chat
    from: team
    to: chat
    acts:
      - {kind: activate, role: tab, name: Chat}
paths:
  main: [team.chat, chat.journeys]
drift: []
