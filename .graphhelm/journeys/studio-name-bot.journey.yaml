schema: graphhelm.journey-flow/1
id: studio-name-bot
title: Give a bot a display name in Lanes
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: mission
    title: A run is open on its Mission graph
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: Canvas}, {role: tab, name: Lanes}]
    scope: [apps/studio/src/components/mission-view.tsx]
  - id: named
    title: The reopened name box uses the saved display name
    url: /?session=studio-fixture
    state: success
    expect: [{role: region, name: Agents}, {role: textbox, name: Name for Planny}, {role: button, name: Cancel}]
    scope: [apps/studio/src/components/lanes-timeline.tsx, apps/studio/src/runtime/team.ts]
  - id: naming
    title: The name box in the Lanes agent row
    url: /?session=studio-fixture
    state: stable
    expect: [{role: textbox, name: Name for planner}, {role: button, name: Save}, {role: button, name: Cancel}]
    scope: [apps/studio/src/components/lanes-timeline.tsx]
  - id: run
    title: The Lanes agent board offers a name for planner
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: Agents}, {role: list, name: Agent board}, {role: button, name: Name this bot}]
    scope: [apps/studio/src/components/lanes-timeline.tsx, apps/studio/src/runtime/team.ts]
edges:
  - id: mission.lanes
    from: mission
    to: run
    acts:
      - {kind: activate, role: tab, name: Lanes}
  - id: naming.save
    from: naming
    to: named
    acts:
      - {kind: enter_text, role: textbox, name: Name for planner, text: Planny}
      - {kind: submit, role: button, name: Save}
      - {kind: activate, role: button, name: Name this bot}
  - id: run.name
    from: run
    to: naming
    acts:
      - {kind: activate, role: button, name: Name this bot}
paths:
  main: [mission.lanes, run.name, naming.save]
drift: []
