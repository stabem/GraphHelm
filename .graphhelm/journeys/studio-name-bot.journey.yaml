schema: graphhelm.journey-flow/1
id: studio-name-bot
title: Owner gives a bot a display name
status: approved
approved: {revision: 74f100918b370b441beaa7b0e9f2d90d8ce7ce48, digest: sha256:81c50247afd63c5515e6281436c2987184bd611e5c078c8afce5dc8468636cc3}
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: named
    title: The alias is recorded; the bot reads by its new name everywhere
    url: /
    state: success
    expect: [{role: region, name: Team}, {role: heading, name: Planny asks}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/team-canvas.tsx, apps/studio/src/runtime/team.ts, apps/studio/src/components/beacon.tsx]
  - id: naming
    title: Inline name form under the bot
    url: /
    state: stable
    expect: [{role: textbox, name: Name for planner}, {role: button, name: Save}, {role: button, name: Cancel}]
    scope: [apps/studio/src/components/team-canvas.tsx]
  - id: run
    title: "A run is open: rail, chat, team canvas, side panel"
    url: /
    state: stable
    expect: [{role: region, name: Team}, {role: button, name: Name this bot}, {role: heading, name: planner asks}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/team-canvas.tsx, apps/studio/src/runtime/team.ts]
edges:
  - id: naming.save
    from: naming
    to: named
    acts:
      - {kind: enter_text, role: textbox, name: Name for planner, text: Planny}
      - {kind: submit, role: button, name: Save}
  - id: run.name
    from: run
    to: naming
    acts:
      - {kind: activate, role: button, name: Name this bot}
paths:
  main: [run.name, naming.save]
drift: []
