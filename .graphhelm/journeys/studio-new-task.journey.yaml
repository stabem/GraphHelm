schema: graphhelm.journey-flow/1
id: studio-new-task
title: Owner starts a new task in the project
status: approved
approved: {revision: 7b09242430064c3cd3dd4b89ed61d75981326e0c, digest: sha256:d1147a99f83a1d3431849b41e4fa855b499e586d1cd133febdb43c9b59be7267}
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, external_delivery]
screens:
  - id: compose
    title: New task composer
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: New task}, {role: heading, name: New task}, {role: textbox, name: What should this task do?}, {role: combobox, name: Model}, {role: button, name: start this task}, {role: button, name: Discard this task}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/compose.tsx, apps/studio/src/components/board.tsx]
  - id: run
    title: "A run is open: rail, chat, team canvas, side panel"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: navigation, name: Projects}, {role: button, name: New task in demo}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/rail.tsx]
  - id: started
    title: The new run opens
    url: /?session=studio-fixture
    state: success
    expect: [{role: region, name: Canvas}, {role: tab, name: Team (live)}, {role: region, name: Team}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/team-canvas.tsx, apps/studio/src/runtime/client.ts]
edges:
  - id: compose.start
    from: compose
    to: started
    acts:
      - {kind: enter_text, role: textbox, name: What should this task do?, text: Write the release notes for version 0.2.}
      - {kind: activate, role: button, name: start this task}
  - id: run.new-task
    from: run
    to: compose
    acts:
      - {kind: activate, role: button, name: New task in demo}
paths:
  main: [run.new-task, compose.start]
drift: []
