schema: graphhelm.journey-flow/1
id: studio-new-task
title: Start a new task in the project
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, external_delivery]
screens:
  - id: compose
    title: The box to write a new task
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: New task}, {role: heading, name: New task}, {role: textbox, name: What should this task do?}, {role: combobox, name: Model}, {role: button, name: start this task}, {role: button, name: Discard this task}]
    scope: [apps/studio/src/components/compose.tsx, apps/studio/src/components/board.tsx]
  - id: run
    title: The projects rail offers a new task
    url: /?session=studio-fixture
    state: stable
    expect: [{role: navigation, name: Projects}, {role: button, name: New task in demo}]
    scope: [apps/studio/src/components/rail.tsx]
  - id: started
    title: The new task opens on its Mission graph
    url: /?session=studio-fixture
    state: success
    expect: [{role: button, name: Write the release notes for version 0.2.}, {role: region, name: Canvas}, {role: tabpanel, name: Graph}, {role: tablist, name: Mission views}, {role: tab, name: Graph}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/mission-view.tsx, apps/studio/src/runtime/client.ts]
edges:
  - id: compose.start
    from: compose
    to: started
    acts:
      - {kind: enter_text, role: textbox, name: What should this task do?, text: Write the release notes for version 0.2.}
      - {kind: activate, role: button, name: start this task}
  - id: run.new-task
    from: run
    to: compose
    acts:
      - {kind: activate, role: button, name: New task in demo}
paths:
  main: [run.new-task, compose.start]
drift: []
