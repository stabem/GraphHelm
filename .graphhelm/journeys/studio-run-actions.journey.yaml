schema: graphhelm.journey-flow/1
id: studio-run-actions
title: "Pause a run, or cancel it after confirming"
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [irreversible_effect, critical_ux]
screens:
  - id: actions
    title: Run actions is open
    url: /?session=studio-fixture
    state: stable
    expect: [{role: button, name: pause · finish in-flight}, {role: button, name: pause now · interrupt}, {role: button, name: resume}, {role: button, name: sweep}, {role: button, name: Cancel execution}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/legality.ts, apps/studio/src/runtime/client.ts]
  - id: cancel-confirm
    title: Cancel asks you to confirm
    url: /?session=studio-fixture
    state: stable
    expect: [{role: button, name: "yes, cancel it"}, {role: button, name: keep running}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/legality.ts, apps/studio/src/runtime/client.ts]
  - id: cancelled
    title: The run is cancelled and has no actions left
    url: /?session=studio-fixture
    state: success
    expect: [{role: button, name: sweep}, {role: button, name: Run actions}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/legality.ts, apps/studio/src/runtime/client.ts]
  - id: paused
    title: The run shows as paused
    url: /?session=studio-fixture
    state: success
    expect: [{role: button, name: resume}, {role: button, name: sweep}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/legality.ts, apps/studio/src/runtime/client.ts]
  - id: run
    title: "A run is open, with its chat and its team on screen"
    url: /?session=studio-fixture
    state: stable
    expect: [{role: button, name: Run actions}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/components/legality.ts]
edges:
  - id: actions.cancel
    from: actions
    to: cancel-confirm
    acts:
      - {kind: activate, role: button, name: Cancel execution}
  - id: actions.pause
    from: actions
    to: paused
    acts:
      - {kind: activate, role: button, name: pause · finish in-flight}
  - id: cancel-confirm.yes
    from: cancel-confirm
    to: cancelled
    acts:
      - {kind: activate, role: button, name: "yes, cancel it"}
  - id: run.actions
    from: run
    to: actions
    acts:
      - {kind: activate, role: button, name: Run actions}
paths:
  main: [run.actions, actions.pause]
  cancel: [run.actions, actions.cancel, cancel-confirm.yes]
drift: []
