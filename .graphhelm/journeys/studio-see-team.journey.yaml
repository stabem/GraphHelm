schema: graphhelm.journey-flow/1
id: studio-see-team
title: Owner sees the live team and opens a bot's window
status: approved
approved: {revision: 74f100918b370b441beaa7b0e9f2d90d8ce7ce48, digest: sha256:a2635167e20721815d4074920b582f569f9109f9e6d5c4bde5ef5b0818744a13}
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
