schema: graphhelm.journey-flow/1
id: studio-see-team
title: See agents and their timeline in Lanes
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
screens:
  - id: lanes
    title: Agents board and lane timeline
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: Agents}, {role: heading, name: Agents}, {role: list, name: Agent board}, {role: region, name: Lanes}, {role: heading, name: "Who did what, and who is stuck"}]
    scope: [apps/studio/src/components/lanes-timeline.tsx, apps/studio/src/runtime/agent-board.ts, apps/studio/src/runtime/lane-bars.ts]
  - id: run
    title: A run is open on its Mission graph
    url: /?session=studio-fixture
    state: stable
    expect: [{role: region, name: Canvas}, {role: tablist, name: Mission views}, {role: tab, name: Lanes}]
    scope: [apps/studio/src/components/mission-view.tsx]
edges:
  - id: run.lanes
    from: run
    to: lanes
    acts:
      - {kind: activate, role: tab, name: Lanes}
paths:
  main: [run.lanes]
drift: []
