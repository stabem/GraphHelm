schema: graphhelm.journey-flow/1
id: studio2-graph-requests
title: Follow each owner request to its result
name: Follow a request
feature: Studio
purpose: "Graph is the approved design (docs/design/studio/Graph.dc.html): the JOURNEYS WITH WORK column, the header counts with the Kanban | Graph tabs, each owner request drawn with lines to its issues, their PRs and the result, and the selected issue's NOW and HISTORY panel."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
viewports: [web, mobile]
screens:
  - id: filtered
    title: All journeys is picked in the JOURNEYS WITH WORK column
    url: /?session=studio-fixture&run=demo
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: complementary, name: Journeys with work, text: JOURNEYS WITH WORK, because: the left column is headed JOURNEYS WITH WORK in the approved Graph design}, {role: button, name: All journeys}, {role: list, name: Owner requests}]
    scope: [apps/studio/src/graph/RequestsView.tsx, apps/studio/src/graph/requests.ts, apps/studio/src/graph/layout.ts, apps/studio/src/views/Views.tsx]
  - id: graph
    title: "Requests are drawn with their issues, PRs and result"
    url: /?session=studio-fixture&run=demo
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Request graph, text: YOU ASKED, because: each owner request is drawn as a YOU ASKED card in the approved Graph design}, {role: list, name: Owner requests, text: no issue opened yet, because: "the fixture records one request, Prove a regression test, with no issue linked, and the graph says so"}, {role: tab, name: Graph view}, {role: complementary, name: Selected work, text: HISTORY, because: the selected work panel has a HISTORY section in the approved design}, {role: link, name: Open the journey in Proof}]
    scope: [apps/studio/src/graph/RequestsView.tsx, apps/studio/src/graph/requests.ts, apps/studio/src/graph/layout.ts, apps/studio/src/views/Views.tsx]
  - id: graph-again
    title: Graph again shows the requests
    url: /?session=studio-fixture&run=demo
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Request graph}, {role: list, name: Owner requests}, {role: region, name: Kanban, absent: true, because: "back in Graph view the Kanban board must be gone, or both views would show at once"}]
    scope: [apps/studio/src/graph/RequestsView.tsx, apps/studio/src/graph/requests.ts, apps/studio/src/graph/layout.ts, apps/studio/src/views/Views.tsx]
  - id: kanban
    title: The same work as Kanban columns
    url: /?session=studio-fixture&run=demo
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Kanban}, {role: tab, name: Graph view}, {role: list, name: Owner requests, absent: true, because: in Kanban view the request graph's list is replaced by the columns}]
    scope: [apps/studio/src/graph/RequestsView.tsx, apps/studio/src/graph/requests.ts, apps/studio/src/graph/layout.ts, apps/studio/src/views/Views.tsx]
edges:
  - id: filtered.kanban
    from: filtered
    to: kanban
    why: "The Kanban tab shows the same work as columns, so the owner can switch how the work is drawn."
    acts:
      - {kind: activate, role: tab, name: Kanban view}
  - id: graph.filtered
    from: graph
    to: filtered
    why: "Picking All journeys in the left column shows every request, so the owner can see all the work at once."
    acts:
      - {kind: activate, role: button, name: All journeys}
  - id: kanban.graph-again
    from: kanban
    to: graph-again
    why: "The Graph tab brings the request graph back, so switching views loses nothing."
    acts:
      - {kind: activate, role: tab, name: Graph view}
paths:
  main: [graph.filtered, filtered.kanban, kanban.graph-again]
drift: []
