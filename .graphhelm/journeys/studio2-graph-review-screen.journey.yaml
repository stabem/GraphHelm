schema: graphhelm.journey-flow/1
id: studio2-graph-review-screen
title: Review a card's screens in the large modal
name: Review a screen
feature: Studio
purpose: "Clicking a card in review or merged opens the large modal with Frame, Side by side, Overlay with a slider, Changes, and Web/Mobile; Close shuts it."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, accessibility]
viewport: {width: 1440, height: 900}
screens:
  - id: board
    title: A card is in review
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Graph}, {role: button, name: Open review}]
    scope: [apps/studio/src/graph/RequestsView.tsx, apps/studio/src/graph/ReviewModal.tsx, apps/studio/src/graph/review.ts, apps/studio/src/views/Views.tsx]
  - id: closed
    title: Close shuts the modal
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: region, name: Graph}, {role: dialog, name: Review, absent: true}]
    scope: [apps/studio/src/graph/RequestsView.tsx, apps/studio/src/graph/ReviewModal.tsx, apps/studio/src/graph/review.ts, apps/studio/src/views/Views.tsx]
  - id: mobile
    title: The same overlay at mobile width
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: slider, name: Now opacity}, {role: region, name: Review frame, text: "390"}]
    scope: [apps/studio/src/graph/RequestsView.tsx, apps/studio/src/graph/ReviewModal.tsx, apps/studio/src/graph/review.ts, apps/studio/src/views/Views.tsx]
  - id: modal
    title: The review modal compares the screens
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: dialog, name: Review}, {role: button, name: Frame}, {role: button, name: Side by side}, {role: button, name: Overlay}, {role: button, name: Changes}, {role: button, name: Web}, {role: button, name: Mobile}]
    scope: [apps/studio/src/graph/RequestsView.tsx, apps/studio/src/graph/ReviewModal.tsx, apps/studio/src/graph/review.ts, apps/studio/src/views/Views.tsx]
  - id: overlay
    title: Overlay shows the opacity slider at web width
    url: /?session=studio-fixture&run=demo
    state: stable
    expect: [{role: slider, name: Now opacity}, {role: region, name: Review frame, text: "1280"}]
    scope: [apps/studio/src/graph/RequestsView.tsx, apps/studio/src/graph/ReviewModal.tsx, apps/studio/src/graph/review.ts, apps/studio/src/views/Views.tsx]
edges:
  - id: board.modal
    from: board
    to: modal
    acts:
      - {kind: activate, role: button, name: Open review}
  - id: mobile.closed
    from: mobile
    to: closed
    acts:
      - {kind: activate, role: button, name: Close review}
  - id: modal.overlay
    from: modal
    to: overlay
    acts:
      - {kind: activate, role: button, name: Overlay}
  - id: overlay.mobile
    from: overlay
    to: mobile
    acts:
      - {kind: activate, role: button, name: Mobile}
paths:
  main: [board.modal, modal.overlay, overlay.mobile, mobile.closed]
drift: []
