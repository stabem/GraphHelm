schema: graphhelm.journey-flow/1
id: studio2-lanes-board
title: See every agent on the Lanes board
name: See the lanes
feature: Studio
purpose: "On Lanes the owner sees WHAT I ASKED with the request Show the work graph for the fixture run, and the planner agent's card in the Blocked column with its request #1556, the ask it serves, its last action and its question, with the reply box addressed to planner; the idle filter takes the active planner off the board."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
viewports: [web, mobile]
screens:
  - id: idle
    title: "Narrowed to idle agents, the active planner leaves the board"
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: listitem, name: "Blocked, empty", because: "the planner recorded work just now, so it is not idle over 30 min and its card leaves the Blocked column"}, {role: region, name: Question, absent: true, because: the planner's question goes with its card once the filter hides it}, {role: region, name: What I asked, text: Show the work graph for the fixture run, because: the filter narrows agents only; the owner's request stays in WHAT I ASKED}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/asked.ts, apps/studio/src/lanes/board.ts, apps/studio/src/topbar/Topbar.tsx]
  - id: lanes
    title: The planner's card is in the Blocked column
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: What I asked, text: Show the work graph for the fixture run In progress · 0 of 1, because: "the fixture records the request Show the work graph for the fixture run, and its one linked issue is not delivered yet"}, {role: list, name: Blocked, text: planner, because: "the planner waits for the owner's answer, so its card sits in the Blocked column"}, {role: group, name: Request, text: "#1556 Show what each lane is doing", because: "the planner's card names the issue it works on, #1556 Show what each lane is doing"}, {role: group, name: For request, text: "for: Show the work graph for the fixture run", because: "the card names the owner's ask that work serves, so the owner ties the agent to the request"}, {role: group, name: Last action, text: planned, because: "the planner's last record is planned, and the card shows it"}, {role: group, name: Not linked, absent: true, because: "#1556 serves the request Show the work graph for the fixture run, so the card does not also call it unlinked"}, {role: region, name: Question, text: "Should the deploy go to staging first, or straight to production?", because: "this is the question the fixture's planner sent the owner, shown on its card so the owner reads it without opening anything"}, {role: complementary, name: Agent, text: REPLY TO planner, because: "the agent asking a question is the one the panel opens on, so the reply box is addressed to planner"}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/asked.ts, apps/studio/src/lanes/board.ts, apps/studio/src/topbar/Topbar.tsx]
edges:
  - id: lanes.idle
    from: lanes
    to: idle
    why: "The idle filter narrows the board to agents quiet for over 30 minutes, so the owner finds the stuck ones; the planner just recorded work, so it leaves."
    acts:
      - {kind: activate, role: button, name: 0 idle over 30 min}
paths:
  main: [lanes.idle]
drift: []
