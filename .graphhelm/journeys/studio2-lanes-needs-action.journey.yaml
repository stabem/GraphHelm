schema: graphhelm.journey-flow/1
id: studio2-lanes-needs-action
title: Clear the Needs action list
name: Clear needs action
feature: Studio
purpose: "Needs action lists the planner's question (the oldest wait) before PR #801 (the newest), and each item's button does its action: Answer opens the reply; Assign hands PR #801 to a free lane and keeps the item for about a minute as a recorded row; Merge, Archive and Reassign each take their item off the list. After each action the board shows what the Runtime recorded."
status: approved
approved: {revision: 3503c43be905f3050aea10fcbd6ea832a92f7d8a, digest: sha256:ccde13f370a2a81b0cc1c36d0d7b460dc02c5dcfd49a065f3e7382e10178d30e}
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
viewports: [web, mobile]
screens:
  - id: answered
    title: Answer opens the reply to the asking lane
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: Answering, because: the Studio says the owner is now answering the planner}, {role: textbox, name: Reply, because: "Answer opens the planner's panel with its reply box, where the answer is typed"}, {role: button, name: Send reply, because: "the panel is replying to the planner's open question, not sending a plain message"}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: archived
    title: Archive takes the silent reviewer off the list
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: Archived lane-gone, because: the Studio names the lane it asked the Runtime to archive}, {role: list, name: Review, text: lane-gone, because: "this comes from the Runtime: once it recorded the stop, the board no longer reads lane-gone as silent, so its card leaves Silent for Review, where its PR #804 waits; with no stop recorded it stays in Silent"}, {role: button, name: Archive lane-gone, absent: true, because: "this comes from the Runtime: the item is built from the board's silent mark on lane-gone, so it leaves Needs action only after the stop was recorded"}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: assigned
    title: Assign hands the unreviewed PR to a free lane
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: "Assigned PR #801 to lane-free", because: "the Studio names the lane it asked the Runtime to make the reviewer: lane-free, the first free lane"}, {role: region, name: Needs action, text: "PR #801 assigned to lane-free", because: "by design the item stays for about a minute as a recorded row, so the owner sees what was done instead of the item vanishing"}, {role: button, name: Assigned lane-author, because: "the recorded row carries a disabled Assigned button in place of Assign, so the same assignment is not sent twice"}, {role: list, name: Review, text: lane-free, because: "this comes from the Runtime: the Review column was empty, and lane-free is drawn there holding PR #801 only once the board names it the PR's reviewer; with no assignment recorded it stays in Backlog"}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: list
    title: Needs action lists items oldest first
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Needs action, text: oldest first, because: the header tells the owner how the list is ordered}, {role: listitem, name: Needs action item 1, text: planner asks you, because: "the planner's question was recorded before every other item, so it is first"}, {role: listitem, name: Needs action item 3, text: "PR #801 has no reviewer", because: "PR #801 was opened after the question and after lane-quiet went silent, so it comes after them"}, {role: button, name: Archive lane-gone, because: "lane-gone reviews PR #804 and has gone silent, so it waits on the owner too"}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: merged
    title: Merge takes the approved PR off the list
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: "Asked to merge PR #802 to lane-review", because: "the Studio asks lane-review, the reviewer whose APPROVE moved PR #802 to merge; the merge itself is that lane's"}, {role: button, name: Ask to merge lane-author, absent: true, because: "this comes from the Runtime: the Studio hides nothing itself, the item leaves Needs action only when the board lists the note the Runtime recorded for it"}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: reassigned
    title: Reassign hands the quiet lane's slice to a free lane
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: "Reassigned #803 to lane-spare", because: "the Studio names the lane it asked the Runtime to hand #803 to: lane-spare, the free lane left once lane-free took the review"}, {role: list, name: Backlog, text: "#803 Quiet lane holds this slice", because: "this comes from the Runtime: the board draws #803 on the card of the free lane it was handed to, in Backlog, and lane-quiet's own card no longer holds it"}, {role: listitem, name: "Silent, empty", because: "this comes from the Runtime: lane-quiet was the last silent lane (the Archive cleared lane-gone), and once its slice was released the board no longer reads it silent"}, {role: button, name: Reassign lane-quiet, absent: true, because: "#803 has a live owner again, so the item leaves Needs action once the Runtime recorded the hand-over"}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
edges:
  - id: answered.assigned
    from: answered
    to: assigned
    why: "Assign gives the waiting work to a lane, so it does not sit idle."
    acts:
      - {kind: activate, role: button, name: Assign lane-author}
  - id: archived.reassigned
    from: archived
    to: reassigned
    why: Work stuck with a quiet lane gets moving again once it is handed to a free lane.
    acts:
      - {kind: activate, role: button, name: Reassign lane-quiet}
  - id: assigned.merged
    from: assigned
    to: merged
    why: "The owner lands approved work without opening GitHub, so a finished pull request stops waiting on him."
    acts:
      - {kind: activate, role: button, name: Ask to merge lane-author}
  - id: list.answered
    from: list
    to: answered
    why: "Answer on the planner's question opens the reply, so a waiting question gets answered."
    acts:
      - {kind: activate, role: button, name: Answer planner}
  - id: merged.archived
    from: merged
    to: archived
    why: "A silent lane will never answer, so archiving it records that: the lane stops counting as silent and its item leaves the owner's list."
    acts:
      - {kind: activate, role: button, name: Archive lane-gone}
paths:
  main: [list.answered, answered.assigned, assigned.merged, merged.archived, archived.reassigned]
drift: []
