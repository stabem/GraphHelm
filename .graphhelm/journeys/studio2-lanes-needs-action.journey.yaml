schema: graphhelm.journey-flow/1
id: studio2-lanes-needs-action
title: Clear the Needs action list
name: Clear needs action
feature: Studio
purpose: "Needs action orders items oldest first, and each item's button does its action: Answer, Assign, Merge, Archive or Reassign."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
viewports: [web, mobile]
screens:
  - id: answered
    title: Answer acts on its item
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: Answering}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: archived
    title: Archive acts on its item
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: Archived}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: assigned
    title: Assign acts on its item
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: Assigned}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: list
    title: Needs action lists items oldest first
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Needs action, text: oldest first}, {role: list, name: Needs action items}, {role: listitem, name: Needs action item 1}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: merged
    title: Merge acts on its item
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: Merge requested}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
  - id: reassigned
    title: Reassign acts on its item
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Last action, text: Reassigned}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/LanesPanels.tsx, apps/studio/src/lanes/panels.ts, apps/studio/src/lanes/board.ts, apps/studio/src/lanes/drafts.ts]
edges:
  - id: answered.assigned
    from: answered
    to: assigned
    acts:
      - {kind: activate, role: button, name: Assign}
  - id: archived.reassigned
    from: archived
    to: reassigned
    acts:
      - {kind: activate, role: button, name: Reassign}
  - id: assigned.merged
    from: assigned
    to: merged
    acts:
      - {kind: activate, role: button, name: Merge}
  - id: list.answered
    from: list
    to: answered
    acts:
      - {kind: activate, role: button, name: Answer}
  - id: merged.archived
    from: merged
    to: archived
    acts:
      - {kind: activate, role: button, name: Archive}
paths:
  main: [list.answered, answered.assigned, assigned.merged, merged.archived, archived.reassigned]
drift: []
