schema: graphhelm.journey-flow/1
id: studio2-lanes-reply
title: Reply to an asking agent
name: Reply to an agent
feature: Studio
purpose: "Replying to an asking agent records an operator_note with replyTo, and the card stops showing the question."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, irreversible_effect]
viewports: [web, mobile]
screens:
  - id: answered
    title: The reply is recorded and the panel says so
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Reply sent}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/drafts.ts]
  - id: asking
    title: The agent's question is shown
    url: /?session=studio-fixture&run=demo&view=lanes
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Question}, {role: textbox, name: Reply}]
    scope: [apps/studio/src/lanes/LanesView.tsx, apps/studio/src/lanes/drafts.ts]
edges:
  - id: asking.answered
    from: asking
    to: answered
    why: Typing a reply to an asking agent and sending it records the owner's answer for that agent.
    acts:
      - {kind: enter_text, role: textbox, name: Reply, text: Use the existing slot.}
      - {kind: submit, role: button, name: Send reply}
paths:
  main: [asking.answered]
drift: []
