    expect: [{role: heading, name: Read the Runtime health, because: the runtime-health proof view titles itself with its journey; a plain Studio start shows the install guide instead}, {role: region, name: Project demo, because: "the owner reached the demo project from a saved link, with no ticket, and the Studio opens it directly"}]
