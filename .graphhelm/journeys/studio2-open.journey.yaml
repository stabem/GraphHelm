schema: graphhelm.journey-flow/1
id: studio2-open
title: Open the Studio on a project
name: Open the Studio
feature: Studio
purpose: "A saved proof link opens the demo project on this machine without a ticket, and switching to Graph keeps the demo run in view."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, authentication]
