schema: graphhelm.journey-flow/1
id: studio2-open
title: Open the Studio on a project
name: Open the Studio
feature: Studio
purpose: "A fresh loopback URL opens the demo project without a ticket, preserves the proof deep link on reload, and keeps the project available when switching views."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, authentication]
viewports: [web, mobile]
screens:
  - id: graph
    title: The demo team run remains available
    url: /?view=graph&journey=runtime-health
    ignoreQuery: [project, run]
    state: stable
    expect: [{role: region, name: Graph, text: RUN demo STATUS, because: the demo run opens after switching from the ticket-free proof deep link}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/login/session.ts, apps/studio/dev-session.ts]
  - id: proof
    title: Ticket-free proof deep link
    url: /?view=proof&journey=runtime-health
    ignoreQuery: [project, run]
    state: stable
    expect: [{role: heading, name: Open the Studio from your project, absent: true, because: a loopback link requires no ticket}, {role: region, name: Project demo, because: the selected demo project is open}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/login/session.ts, apps/studio/dev-session.ts]
edges:
  - id: proof.graph
    from: proof
    to: graph
    intent: Open a saved proof deep link and switch to Graph.
    why: The local browser session opens the project and keeps its run available without a ticket.
    acts:
      - {kind: activate, role: tab, name: Graph}
paths:
  main: [proof.graph]
drift: []
