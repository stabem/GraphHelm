schema: graphhelm.journey-flow/1
id: studio2-proof-approve
title: Approve or reject a run journey
name: Approve a journey
feature: Studio
purpose: Approve and Reject on a fully run journey record the decision and update the journey's status.
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, irreversible_effect]
viewports: [web, mobile]
screens:
  - id: approved
    title: The journey shows as approved
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Approved}, {role: list, name: Journeys, text: approved, because: "the journey list shows the new status, approved"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/decision.ts]
  - id: ran
    title: A fully run journey offers the decision
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: button, name: Approve}, {role: button, name: Reject}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/decision.ts]
  - id: rejected
    title: A rejected journey shows as rejected
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Rejected}, {role: list, name: Journeys, text: rejected, because: "the journey list shows the new status, rejected"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/decision.ts]
edges:
  - id: ran.rejected
    from: ran
    to: rejected
    why: "Reject with a reason records the owner's rejection, and the journey shows as rejected."
    acts:
      - {kind: enter_text, role: textbox, name: Reason for rejecting, text: wrong page}
      - {kind: activate, role: button, name: Reject}
  - id: rejected.approved
    from: rejected
    to: approved
    intent: "A rejection stays open to a later decision: the owner approves the same journey after it."
    why: "A rejected journey can still be approved later, and the journey shows as approved."
    acts:
      - {kind: activate, role: button, name: Approve}
paths:
  main: [ran.rejected, rejected.approved]
drift: []
