schema: graphhelm.journey-flow/1
id: studio2-proof-approve
title: Approve or reject a run journey
name: Approve a journey
feature: Studio
purpose: "On the fully run runtime-health journey, Reject without a reason records nothing, Reject with a reason records the rejection and shows the reason, and a later Approve records the approval; each time the runtime-health row in the journey list shows the new status."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, irreversible_effect]
viewports: [web, mobile]
screens:
  - id: approved
    title: The journey shows as approved
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Approved, because: the decision bar shows the owner's approval once the Runtime recorded it}, {role: listitem, name: Read the Runtime health, text: approved, because: runtime-health's own row in the journey list now carries the approved status}, {role: button, name: Reject, absent: true, because: an approved journey offers no further decision until its content changes}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/decision.ts]
  - id: ran
    title: A fully run journey offers the decision
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: button, name: Approve, because: "runtime-health has a finished, recorded run and no decision yet, so Approve is offered"}, {role: button, name: Reject, because: the owner can refuse the journey instead of approving it}, {role: textbox, name: Reason for rejecting, because: "a rejection needs a reason, so the bar asks for one beside Reject"}, {role: status, name: Rejected, absent: true, because: each viewport starts from a fixture where runtime-health is undecided}, {role: status, name: Approved, absent: true, because: each viewport starts from a fixture where runtime-health is undecided}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/decision.ts]
  - id: refused
    title: Reject without a reason records nothing
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: error
    expect: [{role: status, name: Rejected, absent: true, because: "a rejection with no reason is refused before it reaches the Runtime, so nothing is recorded"}, {role: button, name: Reject, because: the decision is still open after the refusal}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/decision.ts]
  - id: rejected
    title: "A rejected journey shows as rejected, with its reason"
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Rejected, text: wrong page, because: "the decision bar shows the rejection with the reason the owner typed, so a later reader knows why"}, {role: listitem, name: Read the Runtime health, text: rejected, because: runtime-health's own row in the journey list now carries the rejected status}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/decision.ts]
edges:
  - id: ran.refused
    from: ran
    to: refused
    why: "Reject with an empty reason is refused, so a rejection is never recorded without saying why."
    acts:
      - {kind: activate, role: button, name: Reject}
  - id: refused.rejected
    from: refused
    to: rejected
    why: "Reject with a reason records the owner's rejection, and the journey shows as rejected."
    acts:
      - {kind: enter_text, role: textbox, name: Reason for rejecting, text: wrong page}
      - {kind: activate, role: button, name: Reject}
  - id: rejected.approved
    from: rejected
    to: approved
    intent: "A rejection stays open to a later decision: the owner approves the same journey after it."
    why: "A rejected journey can still be approved later, and the journey shows as approved."
    acts:
      - {kind: activate, role: button, name: Approve}
paths:
  main: [ran.refused, refused.rejected, rejected.approved]
drift: []
