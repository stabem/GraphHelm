schema: graphhelm.journey-flow/1
id: studio2-proof-compare
title: Compare Before and Now on a step
name: Compare a step
feature: Studio
purpose: "On a step with an earlier run (the fixture's runtime-health, run now and an hour ago, whose earlier frame has a blue block where Now is green), Side by side, Overlay with its slider and Changes show Before against Now, and Changes says how much of the screen differs, for the web frame and for the mobile frame."
status: approved
approved: {revision: 136a7beb3c935f8df90004993f734215287a24f9, digest: sha256:e1ffb2b4b434eb89fc5d74bf0981307084aa6923c435869674cf614f69d37a2e}
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, accessibility]
viewports: [web, mobile]
screens:
  - id: changes
    title: "Now with the changed regions highlighted, on the web frame"
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: img, name: "Now, changed regions highlighted", because: "Changes draws the Now frame with the regions that differ from Before marked, so the owner sees what moved without flipping images"}, {role: region, name: Compare frame, text: 1280 × 800, because: "the web frame was captured at 1280 by 800, and the frame label names that size, so the owner knows which capture is shown"}, {role: region, name: Compare with an earlier run, text: 25% of the screen changed (in red)., because: "the earlier frame's top-left quarter is blue where Now is green, so Changes counts that quarter as changed and says so in the step's compare panel"}, {role: slider, name: Now opacity, absent: true, because: the opacity slider belongs to Overlay only; Changes replaced it}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/CompareFrame.tsx, apps/studio/src/proof/compare.ts]
  - id: mobile
    title: The same compare on the mobile frame
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: img, name: "Now, changed regions highlighted", because: the Changes mode stays on when the owner switches to the mobile frame}, {role: region, name: Compare with an earlier run, text: 25% of the screen changed (in red)., because: "the mobile capture differs from its earlier run by the same blue quarter, so the mobile compare also reports a quarter of the screen changed"}, {role: region, name: Compare frame, text: 390 × 844, because: "the mobile frame was captured at 390 by 844, and the frame label now names that size instead of 1280 × 800"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/CompareFrame.tsx, apps/studio/src/proof/compare.ts]
  - id: moved
    title: Moving the slider changes how much of Now shows
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: slider, name: Now opacity, text: "100", because: "the owner moved the slider to the end, so Now covers Before completely; a slider that ignored the move would still read 50"}, {role: img, name: Step 1 before, because: Before stays under Now while the slider moves}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/CompareFrame.tsx, apps/studio/src/proof/compare.ts]
  - id: overlay
    title: Now over Before with a slider
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: slider, name: Now opacity, text: "50", because: "Overlay opens with Now half see-through over Before, so both are visible at once"}, {role: img, name: Step 1 before, because: Overlay draws the earlier run's frame underneath}, {role: img, name: Step 1 now, because: Overlay draws this run's frame on top of Before}, {role: group, name: Before and Now side by side, absent: true, because: Overlay replaces the side-by-side pair with one stacked frame}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/CompareFrame.tsx, apps/studio/src/proof/compare.ts]
  - id: side
    title: Before and Now side by side
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: group, name: Before and Now side by side, text: Before, because: "the pair is labelled, so the owner knows which half is the earlier run"}, {role: img, name: Step 1 before, because: the left half is step 1 as the earlier run captured it}, {role: img, name: Step 1 now, because: the right half is step 1 as this run captured it}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/CompareFrame.tsx, apps/studio/src/proof/compare.ts]
  - id: step
    title: A step with history offers the compare
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Compare with an earlier run, because: "runtime-health has an earlier run, so the step offers a comparison with it"}, {role: button, name: Side by side, because: Side by side is one of the three ways to compare Before and Now}, {role: button, name: Overlay, because: Overlay is one of the three ways to compare Before and Now}, {role: button, name: Changes, because: Changes is one of the three ways to compare Before and Now}, {role: region, name: Compare frame, text: 1280 × 800, because: "the compare opens on the web frame, captured at 1280 by 800"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/CompareFrame.tsx, apps/studio/src/proof/compare.ts]
edges:
  - id: changes.mobile
    from: changes
    to: mobile
    why: "The Mobile frame button shows the same compare on the mobile capture, so a change is checked at both sizes the run recorded."
    acts:
      - {kind: activate, role: button, name: Mobile}
  - id: moved.changes
    from: moved
    to: changes
    why: "Changes paints the pixels that differ between Before and Now in red and says what share of the screen changed, so the owner finds what moved without flipping between two images."
    acts:
      - {kind: activate, role: button, name: Changes}
  - id: overlay.moved
    from: overlay
    to: moved
    why: "Dragging the slider to the end shows only Now, so the owner can flick between Before and Now in place."
    acts:
      - {kind: enter_text, role: slider, name: Now opacity, text: "100"}
  - id: side.overlay
    from: side
    to: overlay
    why: "Overlay stacks Now half see-through over Before, so a shift between the two runs shows in one frame instead of two."
    acts:
      - {kind: activate, role: button, name: Overlay}
  - id: step.side
    from: step
    to: side
    why: "Side by side puts the earlier run's frame beside this run's, so the owner can look at both captures of step 1 at once."
    acts:
      - {kind: activate, role: button, name: Side by side}
paths:
  main: [step.side, side.overlay, overlay.moved, moved.changes, changes.mobile]
drift: []
