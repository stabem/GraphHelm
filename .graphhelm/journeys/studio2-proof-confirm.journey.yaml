schema: graphhelm.journey-flow/1
id: studio2-proof-confirm
title: Confirm a draft's commands in Proof
name: Confirm a draft's commands
feature: Studio
purpose: "A draft whose step runs a command waits for the owner: its card's Run shows Run these commands? with the exact command and digest and steps that wait for your confirmation; Confirm and run plays it and it passes (web; studio2-proof-confirm-mobile is the same flow at mobile: a confirm is kept, so each width gets its own fresh fixture)."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, irreversible_effect]
viewports: [web]
screens:
  - id: held
    title: The run waits for the owner's confirmation of the shown commands
    url: /?session=studio-fixture&run=demo&view=proof&journey=cli-hello
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Run these commands?, text: node --version}, {role: status, name: Waits for your confirmation}, {role: listitem, name: Step 2, text: waits for your confirmation}, {role: button, name: Confirm and run}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: journeys
    title: The draft with a command step is selected
    url: /?session=studio-fixture&run=demo&view=proof&journey=cli-hello
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: list, name: Journeys}, {role: button, name: Run Print the Node version}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: passed
    title: The confirmed run passes
    url: /?session=studio-fixture&run=demo&view=proof&journey=cli-hello
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Passed}, {role: listitem, name: Step 2, text: passed}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
edges:
  - id: held.passed
    from: held
    to: passed
    acts:
      - {kind: activate, role: button, name: Confirm and run}
      - {kind: wait_for, role: status, name: Passed}
  - id: journeys.held
    from: journeys
    to: held
    acts:
      - {kind: activate, role: button, name: Run Print the Node version}
      - {kind: wait_for, role: region, name: Run these commands?}
paths:
  main: [journeys.held, held.passed]
drift: []
