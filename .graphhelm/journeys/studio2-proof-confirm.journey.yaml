schema: graphhelm.journey-flow/1
id: studio2-proof-confirm
title: Confirm a draft's commands in Proof
name: Confirm a draft's commands
feature: Studio
purpose: "A draft whose step runs a command waits for the owner: its card's Run shows Run these commands? with the exact command and digest and steps that wait for your confirmation; Confirm and run plays it and it passes, with each command step showing its command, exit code and stdout in a terminal and Approve offered (#1912)."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, irreversible_effect]
viewports: [web, mobile]
screens:
  - id: held
    title: The run waits for the owner's confirmation of the shown commands
    url: /?session=studio-fixture&run=demo&view=proof&journey=cli-hello
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Run these commands?, text: node --version, because: "the fixture draft's only command step runs node --version, and the confirmation shows that exact command"}, {role: status, name: Waits for your confirmation}, {role: listitem, name: Step 2, text: waits for your confirmation, because: "step 2 is the command step, which must not run before the owner confirms"}, {role: button, name: Confirm and run}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: journeys
    title: The draft with a command step is selected
    url: /?session=studio-fixture&run=demo&view=proof&journey=cli-hello
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: list, name: Journeys}, {role: img, name: "Print the Node version: Terminal journey"}, {role: button, name: Run Print the Node version}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: passed
    title: The confirmed run passes
    url: /?session=studio-fixture&run=demo&view=proof&journey=cli-hello
    ignoreQuery: [session, project]
    state: success
    expect: [{role: status, name: Passed}, {role: listitem, name: Step 2, text: passed, because: the command step ran after the confirmation and node printed its version}, {role: listitem, name: Step 1, text: precondition, because: "step 1 is only the shell the commands start from, so it is a precondition, not a step that ran"}, {role: region, name: Terminal, text: node --version, because: the terminal shows the command the step ran}, {role: status, name: Exit code 0}, {role: region, name: Terminal, text: v2, because: "node --version prints the version starting with v, and current Node is v2x"}, {role: img, name: Terminal journey}, {role: button, name: Approve}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts, apps/studio/src/proof/CompareFrame.tsx, apps/studio/src/proof/run-all.ts]
edges:
  - id: held.passed
    from: held
    to: passed
    why: "Confirm and run plays the command the owner saw, and the step passes with its output shown."
    acts:
      - {kind: activate, role: button, name: Confirm and run}
      - {kind: wait_for, role: status, name: Passed}
  - id: journeys.held
    from: journeys
    to: held
    why: "Run on a draft with a command does not run it yet: it shows the exact command and waits for the owner."
    acts:
      - {kind: activate, role: button, name: Run Print the Node version}
      - {kind: wait_for, role: region, name: Run these commands?}
paths:
  main: [journeys.held, held.passed]
drift: []
