schema: graphhelm.journey-flow/1
id: studio2-proof-run-reload
title: A running journey still reads running after the Proof view is opened again
name: "Run, then open the Studio again"
feature: Studio
purpose: "A journey started from the Proof view reads running on a Proof view opened afterwards, which never pressed Run, because the Runtime's journey list reports the run in flight; then the card shows the result once the run ends (#1953)."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, recovery]
viewports: [web]
screens:
  - id: finished
    title: The card shows the result the Runtime recorded
    url: /?session=studio-fixture&run=demo&view=proof&journey=health-slow
    ignoreQuery: [session, project, journey]
    state: success
    expect: [{role: listitem, name: Read a slow health check, text: passed, because: "the slow server always answers ok and the run ends, so the card shows its result"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts]
  - id: journeys
    title: The slow journey is selected
    url: /?session=studio-fixture&run=demo&view=proof&journey=health-slow
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: list, name: Journeys, because: the Proof view lists every journey the owner can run}, {role: button, name: Run Read a slow health check, because: the slow journey's own card carries the Run the owner presses}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts]
  - id: reopened
    title: A Proof view opened afterwards reads the journey running
    url: /?session=studio-fixture&run=demo&view=proof&journey=health-slow
    ignoreQuery: [session, project, journey]
    state: loading
    expect: [{role: tab, name: Proof, because: the owner came back to the Proof view after leaving it}, {role: listitem, name: Read a slow health check, text: running, because: "the Runtime's journey list reports the run still in flight, though this new Proof view never pressed Run"}]
    scope: [apps/cli/src/commands/journey_flow.rs, apps/cli/src/commands/journey_preview.rs, apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts]
  - id: started
    title: The journey started from this view reads running
    url: /?session=studio-fixture&run=demo&view=proof&journey=health-slow
    ignoreQuery: [session, project, journey]
    state: loading
    expect: [{role: listitem, name: Read a slow health check, text: running, because: "the slow server waits six seconds before each answer, so the run is still playing"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts]
edges:
  - id: journeys.started
    from: journeys
    to: started
    why: "The owner starts a journey that takes a while, so he can leave the view and still not lose it."
    acts:
      - {kind: activate, role: button, name: Run Read a slow health check}
  - id: reopened.finished
    from: reopened
    to: finished
    why: "The owner learns how the run ended on the view he came back to, without pressing Run again."
    acts:
      - {kind: wait_for, role: listitem, name: Read a slow health check}
  - id: started.reopened
    from: started
    to: reopened
    why: "The owner leaves the Proof view for Lanes and opens it again; the new view keeps nothing from the old one, so it must learn about the run from the Runtime."
    acts:
      - {kind: activate, role: tab, name: Lanes}
      - {kind: wait_for, role: region, name: Needs action}
      - {kind: activate, role: tab, name: Proof}
      - {kind: wait_for, role: listitem, name: Read a slow health check}
paths:
  main: [journeys.started, started.reopened, reopened.finished]
drift: []
