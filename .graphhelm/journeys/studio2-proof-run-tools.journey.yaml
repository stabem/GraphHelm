schema: graphhelm.journey-flow/1
id: studio2-proof-run-tools
title: Run a journey in Proof through the page tools
name: Run a journey by tool
feature: Studio
purpose: "Through the Studio's page tools, an agent runs the fixture's studio-home journey and opens its log, and the same screens as the click flow studio2-proof-run show Preparing the browser with a readable log, then the step card's frame and a pass verdict for web and for mobile."
status: approved
approved: {revision: e62d57ab1854728f586ac6f0025b1eb4bb931127, digest: sha256:1616600083f4ec8b91e430d6516204d39920eea2d633fe57e5926c71f4ac4e88}
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
viewports: [web, mobile]
screens:
  - id: journeys
    title: A journey is selected and has not run
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio-home
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: button, name: Run, because: "the selected journey offers Run, the one press that starts it"}, {role: listitem, name: Step 1, text: web not run, because: "before the press no viewport has played step 1, so the card says not run"}, {role: status, name: Preparing the browser, absent: true, because: nothing is being prepared until the owner presses Run}, {role: heading, name: Open the Studio and its Lanes, because: "the Proof view's heading names the journey it shows, so this flow fails if the entry URL selected, or the run that started, was any journey other than studio-home"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: log
    title: The run console is open
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio-home
    ignoreQuery: [session, project]
    state: loading
    expect: [{role: log, name: Run console, text: Browser observer ready, because: "the run console prints the observer check the run starts with, so the owner can read whether the browser was ready"}, {role: button, name: Hide log, because: the open console can be closed again with the same button}, {role: heading, name: Open the Studio and its Lanes, because: "the Proof view's heading names the journey it shows, so this flow fails if the entry URL selected, or the run that started, was any journey other than studio-home"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: preparing
    title: The browser is being prepared
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio-home
    ignoreQuery: [session, project]
    state: loading
    expect: [{role: status, name: Preparing the browser, because: "until the first screen is reached the run checks the observer, launches Chromium and opens the app, and the run bar says so"}, {role: button, name: Show log, because: the preparation's lines can be read while it runs}, {role: heading, name: Open the Studio and its Lanes, because: "the Proof view's heading names the journey it shows, so this flow fails if the entry URL selected, or the run that started, was any journey other than studio-home"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: ran
    title: Step cards hold frames and verdicts per viewport
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio-home
    ignoreQuery: [session, project]
    state: success
    expect: [{role: img, name: Step 1 frame, because: "the finished run captured step 1, and its card shows that frame"}, {role: listitem, name: Step 1, text: web ✓, because: "step 1 passed at the web width, and the card marks web with a check instead of not run"}, {role: listitem, name: Step 1, text: mobile ✓, because: "step 1 passed at the mobile width too, and the card marks mobile with a check"}, {role: status, name: Passed, because: the run bar gives the run's verdict once both widths finished}, {role: heading, name: Open the Studio and its Lanes, because: "the Proof view's heading names the journey it shows, so this flow fails if the entry URL selected, or the run that started, was any journey other than studio-home"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
edges:
  - id: journeys.preparing
    from: journeys
    to: preparing
    why: "The Run page tool selects the journey and starts its run, as the Journeys column's Run button does, and the run first prepares the browser and says so."
    acts:
      - {kind: tool, role: webmcp, name: studio_proof_run, arguments: {"journey": "studio-home"}}
  - id: log.ran
    from: log
    to: ran
    why: "When both viewports finish the run bar says Passed and step 1's card holds its frame and a check for web and for mobile, so the owner knows both widths passed."
    acts:
      - {kind: wait_for, role: status, name: Passed}
  - id: preparing.log
    from: preparing
    to: log
    why: "The log page tool opens what the preparation printed, as Show log does, so a slow or failed setup can be read."
    acts:
      - {kind: tool, role: webmcp, name: studio_proof_set_log, arguments: {"open": true}}
paths:
  main: [journeys.preparing, preparing.log, log.ran]
drift: []
