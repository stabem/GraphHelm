schema: graphhelm.journey-flow/1
id: studio2-proof-run
title: Run a journey in Proof
name: Run a journey
feature: Studio
purpose: "Pressing Run shows Preparing the browser with its log, then the steps run and step cards fill with frames and pass or fail per viewport."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, recovery]
viewports: [web, mobile]
screens:
  - id: journeys
    title: A journey is selected
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio2-proof-run
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: list, name: Journeys}, {role: button, name: Run}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: log
    title: The run console is open
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio2-proof-run
    ignoreQuery: [session, project]
    state: loading
    expect: [{role: log, name: Run console, text: observer, because: "the run console prints the browser observer's setup lines, which name the observer"}, {role: button, name: Hide log}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: preparing
    title: The browser is being prepared
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio2-proof-run
    ignoreQuery: [session, project]
    state: loading
    expect: [{role: status, name: Preparing the browser}, {role: button, name: Show log}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: ran
    title: Step cards hold frames and verdicts per viewport
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio2-proof-run
    ignoreQuery: [session, project]
    state: success
    expect: [{role: list, name: Steps}, {role: img, name: Step 1 frame}, {role: listitem, name: Step 1, text: web, because: "every run plays both widths, so step 1 carries a web verdict"}, {role: listitem, name: Step 1, text: mobile, because: "every run plays both widths, so step 1 carries a mobile verdict"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
edges:
  - id: journeys.preparing
    from: journeys
    to: preparing
    why: "Run first prepares the browser and says so, so the owner knows the run started."
    acts:
      - {kind: activate, role: button, name: Run}
  - id: log.ran
    from: log
    to: ran
    why: When the run ends each step card holds its frame and its verdict for web and for mobile.
    acts:
      - {kind: wait_for, role: list, name: Steps}
  - id: preparing.log
    from: preparing
    to: log
    why: "Show log opens what the preparation printed, so a slow or failed setup can be read."
    acts:
      - {kind: activate, role: button, name: Show log}
paths:
  main: [journeys.preparing, preparing.log, log.ran]
drift: []
