schema: graphhelm.journey-flow/1
id: studio2-proof-search
title: Find a journey in Proof by searching
name: Search the journeys
feature: Studio
purpose: "In Proof, typing in Search journeys narrows the list to the journeys whose name, id or group holds the text and says how many of all journeys are shown; a text that matches none says so, and clearing the field brings every journey back."
status: approved
approved: {revision: 055a133a58b50c96c92c5df3ca108628137d0e19, digest: sha256:9b14c3b1dce1fc3c9db8aa612ddf945efd9e53d50f2ad0f126faf000ec4dc28a}
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux, accessibility]
viewports: [web, mobile]
screens:
  - id: all
    title: Every journey is listed and the search field is empty
    url: /?session=studio-fixture&run=demo&view=proof
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: searchbox, name: Search journeys, because: "the journeys column offers a search field above the list, so the owner can find one journey among many"}, {role: listitem, name: Install GraphHelm from INSTALL.md and run the first commands, because: "with nothing typed the list shows every journey, and the install flow is the first card of the first group"}, {role: listitem, name: Studio auth refusal, because: "with nothing typed the list shows every group, so the first card of the Studio group is listed beside the first group's"}, {role: status, name: Journeys shown, absent: true, because: the count of shown journeys appears only while a search is typed}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/journey-search.ts, apps/studio/src/styles.css]
  - id: cleared
    title: Clearing the search brings every journey back
    url: /?session=studio-fixture&run=demo&view=proof
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: searchbox, name: Search journeys, because: "the field the search was typed in is on the frame beside the list, so the owner sees where the search was cleared"}, {role: listitem, name: Install GraphHelm from INSTALL.md and run the first commands, because: "the field is empty again, so the list shows the first card of the first group, which the typed search had hidden"}, {role: listitem, name: Studio auth refusal, because: "the list shows the first card of the Studio group again, so more than one group is back"}, {role: status, name: Journeys shown, absent: true, because: with the field empty the count of shown journeys is gone}, {role: button, name: Clear search, absent: true, because: "the Clear search button shows only while the field holds text, so its absence means the field is empty"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/journey-search.ts, apps/studio/src/styles.css]
  - id: found
    title: The list is narrowed to the journeys that match
    url: /?session=studio-fixture&run=demo&view=proof
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: listitem, name: Reply to an agent, because: "its id studio2-lanes-reply holds the typed text reply, so its card stays in the list"}, {role: listitem, name: Compare a step, absent: true, because: "neither its name, its id nor its group holds the typed text, so the search hides its card"}, {role: status, name: Journeys shown, text: 1 of 29 journeys, because: "exactly one of the fixture's 29 journeys matches, so the line reads 1 of 29 journeys; the text check only looks for that text, so it would also pass for 11 of 29 or 21 of 29, and the two absent cards below rule those out; the flow goes red when the fixture gains or loses a journey"}, {role: listitem, name: Open the Studio, absent: true, because: "its name, id and group hold no reply, so a filter that lets more than one journey through shows it"}, {role: listitem, name: Start from no run, absent: true, because: "its name, id and group hold no reply, so a filter that lets more than one journey through shows it"}, {role: button, name: Clear search, because: "a search is typed, so the field offers to clear it"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/journey-search.ts, apps/studio/src/styles.css]
  - id: none
    title: Nothing matches the typed text
    url: /?session=studio-fixture&run=demo&view=proof
    ignoreQuery: [session, project]
    state: empty
    expect: [{role: status, name: Journeys shown, text: 0 of 29 journeys No journey matches “zzz-no-such-journey”., because: "no journey holds the typed text, so the one status region reads its whole text: zero shown of the fixture's 29 journeys, then the no-match message naming the typed text; the flow goes red when the fixture gains or loses a journey"}, {role: listitem, name: Reply to an agent, absent: true, because: "the typed text no longer matches it, so no card is listed"}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/journey-search.ts, apps/studio/src/styles.css]
edges:
  - id: all.found
    from: all
    to: found
    why: "Typing reply into Search journeys narrows the list to the journeys that hold that text, so the owner finds one without scrolling."
    acts:
      - {kind: enter_text, role: searchbox, name: Search journeys, text: reply}
  - id: found.none
    from: found
    to: none
    why: "Typing a text no journey holds shows that nothing matches, so the owner is told instead of seeing a blank list."
    acts:
      - {kind: enter_text, role: searchbox, name: Search journeys, text: zzz-no-such-journey}
  - id: none.cleared
    from: none
    to: cleared
    why: "Clear search empties the field and the whole list returns, so one press ends the search."
    acts:
      - {kind: activate, role: button, name: Clear search}
paths:
  main: [all.found, found.none, none.cleared]
drift: []
