schema: graphhelm.journey-flow/1
id: studio2-proof-stale
title: A journey edited since its last run reads changed and keeps that run's frames
name: Edited since its last run
feature: Studio
purpose: "A journey whose flow was edited after its run reads 'Changed since last run' on its card and in the header, never passed, and the panel shows that run's frames dimmed with a stale mark, from the earlier version, with Run to prove the current one (#1956)."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
viewports: [web]
screens:
  - id: changed
    title: The header reads changed since the last run and the steps show the earlier frames marked stale
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project, journey]
    state: stable
    expect: [{role: status, name: Changed since last run, because: "the fixture edits that journey after its recorded run, so the header must say the run is of an earlier version"}, {role: status, name: Passed, absent: true, because: "a run of an earlier version proves nothing about this one, so the header never reads passed"}, {role: button, name: Run Read the health edited after its run, because: the journey's own Run is how the owner proves the current version}, {role: img, name: Step 1 frame, because: "the earlier run's first frame is kept, so the owner still sees what was proven before"}, {role: list, name: Steps, text: STALE, because: "each frame comes from the earlier version, and each step is marked STALE"}, {role: region, name: Journey run, text: 2 stale · this version never ran, because: "the header counts the two steps of the earlier run as stale, not passed, since the edited version has not run"}, {role: listitem, name: Step 1, text: not run on this version, because: the step card does not report the earlier pass as this version's result}, {role: region, name: Compare with an earlier run, text: passed on the earlier version; this version has not run, because: "the kept run was played on the flow before its edit, and the compare line says so instead of calling it this version's pass"}]
    scope: [apps/studio/src/proof/CompareFrame.tsx, apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: open
    title: Another journey is selected and the edited journey's card reads changed since the last run
    url: /?session=studio-fixture&run=demo&view=proof&journey=runtime-health
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: listitem, name: Read the health edited after its run, text: Changed since last run, because: "the fixture edits that journey after its recorded run, so the card must not read passed"}, {role: button, name: Select Read the health edited after its run, because: the owner opens the edited journey from its card}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts]
edges:
  - id: open.changed
    from: open
    to: changed
    why: "The owner opens a journey he edited to see whether it still holds, and must not mistake the old run for proof of the new version."
    acts:
      - {kind: activate, role: button, name: Select Read the health edited after its run}
      - {kind: wait_for, role: status, name: Changed since last run}
paths:
  main: [open.changed]
drift: []
