    url: /?session=studio-fixture&run=demo&view=proof&journey=studio2-proof-stale
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: status, name: Changed since last run}, {role: region, name: Journey run, text: from the earlier version, because: the kept run was played on the flow before its edit and the header says so}, {role: button, name: Run}, {role: img, name: Step 1 frame}, {role: img, name: Step 2 frame}, {role: list, name: Steps, text: stale, because: each frame comes from the earlier version and is marked stale}]
