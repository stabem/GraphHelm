    url: /?session=studio-fixture&run=demo&view=proof&journey=studio2-proof-stale
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: listitem, name: Edited since its last run, text: Changed since last run, because: the fixture edits this flow after its recorded run so the card must not read passed}]
