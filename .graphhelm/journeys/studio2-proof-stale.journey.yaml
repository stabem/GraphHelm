schema: graphhelm.journey-flow/1
id: studio2-proof-stale
title: A journey edited since its last run reads changed and keeps that run's frames
name: Edited since its last run
feature: Studio
purpose: "A journey whose flow was edited after its run reads 'Changed since last run' on its card and in the header, never passed, and the panel shows that run's frames dimmed with a stale mark, from the earlier version, with Run to prove the current one (#1956)."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: []
risks: [critical_ux]
viewports: [web]
screens:
  - id: changed
    title: The card and the header read changed since the last run and offer Run
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio2-proof-stale
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: listitem, name: Edited since its last run, text: Changed since last run}, {role: status, name: Changed since last run}, {role: region, name: Journey run, text: from the earlier version}, {role: button, name: Run}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/steps.ts, apps/studio/src/proof/use-journey-run.ts]
  - id: frames
    title: The steps show the earlier version's frames marked stale
    url: /?session=studio-fixture&run=demo&view=proof&journey=studio2-proof-stale
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: img, name: Step 1 frame}, {role: img, name: Step 2 frame}, {role: list, name: Steps, text: stale}]
    scope: [apps/studio/src/proof/ProofView.tsx, apps/studio/src/proof/use-journey-run.ts]
edges:
  - id: changed.frames
    from: changed
    to: frames
    acts:
      - {kind: wait_for, role: img, name: Step 1 frame}
paths:
  main: [changed.frames]
drift: []
