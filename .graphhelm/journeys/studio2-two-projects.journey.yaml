schema: graphhelm.journey-flow/1
id: studio2-two-projects
title: Switch between two projects
name: Switch projects
feature: Studio
purpose: "The owner adds a second project folder, proj-two, within the local browser session; it appears as its own sidebar card in the same Studio with its own team run, second-run, and switching back to demo opens demo's run again, with no run list; an invalid folder adds nothing. Refusing a caller with no session is not promised here: that is studio2-auth-refusal."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: [proj_two_folder]
risks: [critical_ux, multiple_components]
viewports: [web, mobile]
screens:
  - id: back
    title: demo opens again with its own run
    url: /
    ignoreQuery: [session, project, run]
    state: stable
    expect: [{role: banner, name: Top bar, text: demo / demo, because: "the top bar reads project / run: demo and its own team run, demo, not proj-two's second-run"}, {role: region, name: Graph, text: RUN demo STATUS, because: "Graph shows demo's own run, so the switch did not keep second-run open under the demo label"}, {role: heading, name: proj-two, absent: true, because: the top bar no longer names proj-two once the owner switched back}, {role: link, name: proj-two, because: "proj-two stays in the sidebar as its own card, one click away"}, {role: complementary, name: Journeys with work, text: 0 of 24, because: "demo's own 24 journeys (the fixture's fixed set, which moves only when that set is edited on purpose) are read again after the switch back, none with work in flight, so the Graph is not left with proj-two's list or a half-loaded one"}, {role: link, name: demo, absent: true, because: "demo is the open card, not a link, and a card lists no run: a run list returning under the card would render demo's run as a link named demo, as the sidebar did before one card per project (#1902)"}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/sidebar/Sidebar.tsx, apps/studio/src/topbar/Topbar.tsx, apps/studio/src/sidebar/project-summary.ts, apps/studio/src/login/session.ts, apps/studio/src/graph/RequestsView.tsx]
  - id: first
    title: demo is open with its own run
    url: /
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: region, name: Project demo, text: demo · 0 agents, because: "demo's sidebar card names its active run, demo"}, {role: banner, name: Top bar, text: demo / demo, because: "the top bar reads project / run, both demo"}, {role: region, name: Graph, text: RUN demo STATUS, because: Graph shows demo's own team run}, {role: region, name: Request graph, text: No owner request is recorded on this run yet., because: "the Graph finished reading demo's requests and has none to draw, so the screen is judged on the answered page, not on the Loading placeholder"}, {role: link, name: demo, absent: true, because: "demo is the open card, not a link, and a card lists no run: a run list returning under the card would render demo's run as a link named demo, as the sidebar did before one card per project (#1902)"}, {role: region, name: Project proj-two, absent: true, because: "proj-two is a real project folder with its own run, but the Studio has not been told about it yet, so it has no card until the owner adds it"}, {role: link, name: proj-two, absent: true, because: "the sidebar offers no way to open proj-two before it is added, so the add step is what makes it appear"}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/sidebar/Sidebar.tsx, apps/studio/src/topbar/Topbar.tsx, apps/studio/src/sidebar/project-summary.ts, apps/studio/src/login/session.ts, apps/studio/src/graph/RequestsView.tsx]
  - id: refused
    title: An invalid folder adds no project
    url: /
    ignoreQuery: [session, project]
    state: error
    expect: [{role: form, name: Add project folder, text: That folder is not a GraphHelm project., because: "an invalid project folder is refused, and the form says so instead of failing silently"}, {role: banner, name: Top bar, text: demo / demo, because: "nothing changed: demo and its run stay open"}, {role: region, name: Project missing-project-folder, absent: true, because: "the Studio names a card by its folder, so a card for the invalid folder would be called missing-project-folder; the refusal added none"}, {role: region, name: Project proj-two, absent: true, because: "the refused add registered no project at all, proj-two included"}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/sidebar/Sidebar.tsx, apps/studio/src/login/session.ts, apps/studio/src/topbar/Topbar.tsx]
  - id: second
    title: The added project opens with its own run
    url: /
    ignoreQuery: [session, project, run]
    state: stable
    expect: [{role: region, name: Project proj-two, text: second-run, because: "proj-two joined as its own sidebar card, naming its own team run, second-run"}, {role: banner, name: Top bar, text: proj-two / second-run, because: the top bar reads project / run for the project just added}, {role: region, name: Graph, text: RUN second-run STATUS, because: "Graph shows proj-two's own run, not demo's"}, {role: region, name: Request graph, text: No owner request is recorded on this run yet., because: "proj-two's own Runtime answered the Graph's requests for second-run (it has none yet), so the Error check below is judged after an answer, not while the Graph still loads"}, {role: link, name: demo, because: "demo is still in the same Studio as its own card, so the owner can switch back"}, {role: link, name: second-run, absent: true, because: "proj-two is the open card and lists no run: a run list returning under the card would render its run as a link named second-run, as the sidebar did before one card per project (#1902)"}, {role: region, name: Error, absent: true, because: "proj-two's own Runtime serves its run's requests, so the Graph opens without an error box"}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/sidebar/Sidebar.tsx, apps/studio/src/topbar/Topbar.tsx, apps/studio/src/sidebar/project-summary.ts, apps/studio/src/login/session.ts, apps/studio/src/graph/RequestsView.tsx]
edges:
  - id: first.refused
    from: first
    to: refused
    intent: The owner means to add proj-two but submits a folder that is not a GraphHelm project.
    why: "A folder that is not a GraphHelm project is refused with a message and adds no card, so a typo cannot attach a stray project to this Studio."
    acts:
      - {kind: activate, role: button, name: Add project folder}
      - {kind: enter_text, role: textbox, name: Project folder, text: missing-project-folder}
      - {kind: submit, role: button, name: Add}
  - id: refused.second
    from: refused
    to: second
    intent: The owner corrects the folder to proj-two's real project folder in the same form and adds it.
    why: "After a refusal the same form still takes the right folder: adding proj-two through the local browser session makes it appear as its own card in the same Studio, so the owner watches both projects from one port."
    acts:
      - {kind: enter_text, role: textbox, name: Project folder, secret: proj_two_folder}
      - {kind: submit, role: button, name: Add}
  - id: second.back
    from: second
    to: back
    why: "Switching back in the sidebar opens demo's own run again, so each card always leads to its own project's work."
    acts:
      - {kind: activate, role: link, name: demo}
paths:
  main: [first.refused, refused.second, second.back]
drift: []
