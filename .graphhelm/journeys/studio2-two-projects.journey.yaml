schema: graphhelm.journey-flow/1
id: studio2-two-projects
title: Switch between two projects
name: Switch projects
feature: Studio
purpose: "A second project folder joins the same Studio port as its own sidebar card, and switching in the sidebar opens each project's own team run, with no run list."
status: draft
approved: null
base: http://127.0.0.1:5184
actors: [owner]
secrets: [proj_two_folder, proj_two_ticket]
risks: [critical_ux, multiple_components]
viewports: [web, mobile]
screens:
  - id: back
    title: The first project opens again from the sidebar
    url: /?session=studio-fixture
    ignoreQuery: [session, project, run]
    state: stable
    expect: [{role: banner, name: Top bar, text: demo, because: "the top bar names the open project, demo"}, {role: region, name: Project demo}, {role: link, name: proj-two}, {role: list, name: Runs in demo, absent: true, because: each project is one card with no run list under it}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/sidebar/Sidebar.tsx, apps/studio/src/topbar/Topbar.tsx, apps/studio/src/sidebar/project-summary.ts, apps/studio/src/login/session.ts]
  - id: first
    title: The first project's run is shown
    url: /?session=studio-fixture
    ignoreQuery: [session, project]
    state: stable
    expect: [{role: navigation, name: Projects}, {role: region, name: Project demo, text: journeys, because: the project card in the sidebar counts its journeys}, {role: banner, name: Top bar, text: demo, because: "the top bar names the open project, demo"}, {role: list, name: Runs in demo, absent: true, because: each project is one card with no run list under it}, {role: button, name: Add project folder}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/sidebar/Sidebar.tsx, apps/studio/src/topbar/Topbar.tsx, apps/studio/src/sidebar/project-summary.ts, apps/studio/src/login/session.ts]
  - id: second
    title: The added project opens with its own run
    url: /?session=studio-fixture
    ignoreQuery: [session, project, run]
    state: stable
    expect: [{role: banner, name: Top bar, text: second-run, because: "the second project's own team run is second-run, and the top bar names it"}, {role: region, name: Project proj-two}, {role: link, name: demo}, {role: list, name: Runs in proj-two, absent: true, because: each project is one card with no run list under it}]
    scope: [apps/studio/src/App.tsx, apps/studio/src/sidebar/Sidebar.tsx, apps/studio/src/topbar/Topbar.tsx, apps/studio/src/sidebar/project-summary.ts, apps/studio/src/login/session.ts]
edges:
  - id: first.second
    from: first
    to: second
    intent: The owner adds the second project's folder with the ticket graphhelm studio open --project minted for it.
    why: Adding a second project folder with its ticket opens it as its own card in the same Studio.
    acts:
      - {kind: activate, role: button, name: Add project folder}
      - {kind: enter_text, role: textbox, name: Project folder, secret: proj_two_folder}
      - {kind: enter_text, role: textbox, name: Ticket from graphhelm studio open --project, secret: proj_two_ticket}
      - {kind: submit, role: button, name: Add}
  - id: second.back
    from: second
    to: back
    why: Switching back in the sidebar opens the first project's own run again.
    acts:
      - {kind: activate, role: link, name: demo}
paths:
  main: [first.second, second.back]
drift: []
