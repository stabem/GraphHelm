[workspace]
resolver = "3"
members = [
  "core/protocols",
  "core/schema",
  "core/schema-evolution",
  "core/graph",
  "core/policy",
  "core/events",
  "core/governor",
  "core/simulation",
  "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml_ng = "=0.10.0"
jsonschema = { version = "=0.49.2", default-features = false }
sha2 = "=0.11.0"
hex = "=0.4.3"
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "=1.24.0", features = ["v4", "serde"] }
thiserror = "=2.0.19"
fs2 = "=0.4.3"
clap = { version = "=4.6.4", features = ["derive"] }
proptest = "=1.11.0"
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
tempfile = "=3.27.0"
semver = { version = "=1.0.28", features = ["serde"] }
windows-sys = "=0.61.2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
debug = 1
