[package]
name = "graphhelm-postgres-event-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
chacha20poly1305.workspace = true
chrono.workspace = true
getrandom.workspace = true
graphhelm-events = { path = "../../core/events" }
graphhelm-protocols = { path = "../../core/protocols" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
graphhelm-graph = { path = "../../core/graph" }

[[test]]
name = "concurrency"
path = "tests/concurrency.rs"
required-features = ["test-support"]

[[test]]
name = "repository_conformance"
path = "tests/repository_conformance.rs"
required-features = ["test-support"]
