[package]
name = "graphhelm-sealed-key-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chacha20poly1305.workspace = true
fs2.workspace = true
getrandom.workspace = true
graphhelm-events = { path = "../../core/events" }
graphhelm-protocols = { path = "../../core/protocols" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# Storage handles, direct DACL/owner inspection, and the current process token only.
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# Exact-pinned and authorized only for this adapter's openat/linkat/unlinkat/no-follow boundary.
libc.workspace = true

[dev-dependencies]
static_assertions.workspace = true
tempfile.workspace = true
