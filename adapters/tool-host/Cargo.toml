[package]
name = "graphhelm-tool-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# A REAL dependency, not dev-only, and that is a change from this PR's first shape. The cancellation
# seam must bind each spawn to an identity the reap cannot invalidate, and the binding happens at
# spawn time -- in production code. #618 will need this crate here anyway, to kill the tree through
# the same funnel; making it a dependency now is that direction rather than a detour.
graphhelm-process-tree = { path = "../process-tree" }
graphhelm-tool-broker = { path = "../../core/tool-broker" }
# #543: the production SourceReader implements the runtime port here, in the adapter that
# already owns disk readers; runtime does not depend back on this crate, so no cycle.
graphhelm-runtime = { path = "../../core/runtime" }
graphhelm-protocols = { path = "../../core/protocols" }
keel-contract-index = { path = "../../tools/keel-contract-index" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Authorized workspace dep: O_NOFOLLOW/O_NONBLOCK candidate opens in source_channel.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# #726: PeekNamedPipe polls a reader's pipe without blocking. Project document replacement also
# needs filesystem publication and security APIs to preserve owner/group/DACL before writing.
windows-sys = { workspace = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    # #1086: the excerpt reader opens each ancestor as itself (FILE_FLAG_OPEN_REPARSE_POINT) and
    # identity-checks the final handle (GetFinalPathNameByHandleW).
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# #726: CreatePipe's SECURITY_ATTRIBUTES is also used by the
# synthetic-pipe test fixture in process.rs's own `mod tests` -- a test-controlled pipe standing in
# for a real escaped descendant, which Windows has no way to stage (CREATE_BREAKAWAY_FROM_JOB is
# never granted by this job).
windows-sys = { workspace = true, features = ["Win32_Security"] }
