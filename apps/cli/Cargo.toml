[package]
name = "graphhelm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "graphhelm"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
clap.workspace = true
getrandom.workspace = true
graphhelm-events = { path = "../../core/events" }
graphhelm-execution = { path = "../../core/execution" }
graphhelm-gateway = { path = "../../core/gateway" }
graphhelm-governor = { path = "../../core/governor" }
graphhelm-graph = { path = "../../core/graph" }
graphhelm-model-gateway = { path = "../../adapters/model-gateway" }
graphhelm-policy = { path = "../../core/policy" }
graphhelm-postgres-event-store = { path = "../../adapters/postgres-event-store" }
graphhelm-protocols = { path = "../../core/protocols" }
graphhelm-schema = { path = "../../core/schema" }
graphhelm-schema-evolution = { path = "../../core/schema-evolution" }
graphhelm-sealed-key-provider = { path = "../../adapters/sealed-key-provider" }
graphhelm-tool-broker = { path = "../../core/tool-broker" }
graphhelm-tool-host = { path = "../../adapters/tool-host" }
graphhelm-simulation = { path = "../../core/simulation" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
