schema: graphhelm.journey-flow/1
id: backend
title: Backend journey
purpose: A client greets the service and then fetches its data over HTTP.
status: draft
approved: null
base: http://127.0.0.1:8765
actors: [client]
secrets: []
risks: []
screens:
  - id: fetched
    title: The data the client fetched
    url: /
    state: success
    expect: [{role: status, name: "200", because: the items route answers a GET with HTTP 200}, {role: json, name: items.0.name=apple, because: the fixture server holds one item named apple}]
    scope: unknown
  - id: greeted
    title: The greeting the service answered
    url: /
    state: success
    expect: [{role: exit, name: "0", because: greet.sh succeeds}, {role: stdout, name: hello, because: greet.sh prints hello}]
    scope: unknown
  - id: start
    title: The service status before any request
    url: /status.json
    state: stable
    expect: [{role: status, name: "200", because: a running service answers its status route with HTTP 200}, {role: json, name: status=ok, because: the fixture server reports itself ok}]
    scope: unknown
edges:
  - id: fetch
    from: greeted
    to: fetched
    why: The client fetches the service's items over HTTP.
    acts:
      - {kind: http, role: GET, name: /items.json}
  - id: greet
    from: start
    to: greeted
    why: The service greets the client from the command line.
    acts:
      - {kind: cli, role: exec, name: sh greet.sh}
paths:
  main: [greet, fetch]
drift: []
