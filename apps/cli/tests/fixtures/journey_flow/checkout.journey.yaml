schema: graphhelm.journey-flow/1
id: checkout
title: Shopper pays for the cart
purpose: A shopper pays for the cart with their password and sees the order confirmed.
status: draft
approved: null
base: http://localhost:3000
actors: [shopper]
secrets: [shopper_password]
risks: [money]
screens:
  - id: cart
    title: The cart with its items
    url: /cart
    state: stable
    expect: [{role: heading, name: Cart}, {role: button, name: Checkout}]
    scope: [app/cart/page.tsx]
  - id: done
    title: The order confirmation
    url: /orders/:id
    state: success
    expect: [{role: heading, name: Order placed}]
    scope: unknown
  - id: pay
    title: The payment step that asks for the password
    url: /checkout
    state: stable
    expect: [{role: textbox, name: Password}]
    scope: [app/checkout/page.tsx, app/api/pay/route.ts]
edges:
  - id: cart.checkout
    from: cart
    to: pay
    why: The shopper can leave the cart and reach the payment step.
    acts:
      - {kind: activate, role: button, name: Checkout}
  - id: pay.submit
    from: pay
    to: done
    why: Paying with the password places the order, so the shopper sees it confirmed.
    acts:
      - {kind: enter_text, role: textbox, name: Password, secret: shopper_password}
      - {kind: submit, role: button, name: Pay now}
paths:
  main: [cart.checkout, pay.submit]
drift: []
