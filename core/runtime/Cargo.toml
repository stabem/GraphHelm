[package]
name = "graphhelm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
graphhelm-events = { path = "../events" }
graphhelm-execution = { path = "../execution" }
graphhelm-gateway = { path = "../gateway" }
graphhelm-protocols = { path = "../protocols" }
graphhelm-simulation = { path = "../simulation" }
graphhelm-tool-broker = { path = "../tool-broker" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[dev-dependencies]
chrono.workspace = true
# #668: the runtime dispatches gates through `GateRegistryPort` and no longer names any
# particular gate's evaluator. Geometry is still the evaluator the gate cells wire in, so the
# dependency survives HERE, where a test chooses it, instead of in the crate that must not.
graphhelm-quality = { path = "../quality" }
# #1086: a sealed `context-provenance@1` record is validated with the repository's own offline
# validator. A DEV-dependency only: the production table stays the declared twelve.
graphhelm-schema = { path = "../schema" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
