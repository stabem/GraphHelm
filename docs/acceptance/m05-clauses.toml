# The Milestone 05 acceptance clauses (runtime-design §8), each bound to the tests that
# prove it. `acceptance_map_is_grounded` (tools/acceptance-map) verifies every binding
# against the real tree: the fn exists exactly once, its suite is on the gate's invocation
# surface, and the assert_fingerprint appears inside the test's body — gutting a test breaks
# the map. M05_ACCEPTANCE_MAP.md is generated from this file and diff-checked.

[[clause]]
id = "real-work-to-completion"
text = "A published graph with agent and tool nodes runs to completion doing real work — a model call and a repository/shell/test cycle — with every transition durable and the full history replaying byte-identically."
rationale = "The 05d/05e acceptance sentence as one named test: a replying model fake, a real git tool in a Tier 1 worktree, sealed evidence, and a double replay compared byte for byte."

[[clause.prover]]
fn = "an_agent_and_a_tool_node_run_to_completion_with_sealed_evidence"
suite = "runtime_http"
assert_fingerprint = "replay must be byte-identical"

# 05f Task 7: the run executed 2026-08-16 on the owner subscription (native_runtime route
# spawning the claude CLI, -p --output-format json; NOT direct_api — §8 says "a model
# call", and the subscription transport is the one the owner's setup actually uses). One
# real story: agent reply from the live model, tool node running real git in a Tier 1
# worktree, completion over HTTP, double replay byte-identical
# (8af437109bd8...63222f twice), CLI/HTTP/MCP status dumps identical, monitor snapshot
# captured. The gate never re-runs the call; it re-hashes the evidence.
[[clause.artifact]]
directory = "docs/acceptance/m05-run-2026-08-16"
description = "one real story on the owner-subscription route (claude CLI), completed and replayed byte-identically"

[[clause]]
id = "one-state-from-every-surface"
text = "The same execution can be started, observed, signalled, approved, paused, resumed and cancelled from the CLI, the HTTP API, and a Claude Code or Codex chat via the MCP server — with identical observable state at every point."
rationale = "Two parity stories: CLI vs API (05a's tripwire, surviving the 05d async swap) and MCP vs API (05e, with the exception list empty by design)."

[[clause.prover]]
fn = "the_cli_and_the_api_report_identical_status_for_the_same_story"
suite = "api_http"
assert_fingerprint = "identical status data for the identical story"

[[clause.prover]]
fn = "the_mcp_and_the_api_report_identical_status_for_the_same_story"
suite = "mcp_stdio"
assert_fingerprint = "empty by design"

[[clause]]
id = "monitor-without-a-single-mutation"
text = "The monitor shows a running execution's states, triage list and events without offering a single mutation."
rationale = "Rendering proven over the same projection status folds, and read-only proven over store bytes: hammer every route with every verb and the store is bit-identical."

[[clause.prover]]
fn = "the_monitor_renders_states_triage_and_tail_from_the_same_projection_fixture"
suite = "workspace tests"
assert_fingerprint = "renders its state exactly once"

[[clause.prover]]
fn = "hammering_the_monitor_never_changes_a_byte_of_the_store"
suite = "monitor_http"
assert_fingerprint = "the store must be bit-identical after the hammer"

[[clause]]
id = "credentials-absent-from-tier-1"
text = "Credentials are demonstrably absent from every Tier 1 workspace."
rationale = "The 05c hard constraint: a sentinel-laden environment runs a Tier 1 tool and the sentinel is provably unreachable from inside the workspace."

[[clause.prover]]
fn = "credentials_are_demonstrably_absent_from_the_tier_1_workspace"
suite = "workspace tests"
assert_fingerprint = "inner sentinel run failed"

[[clause]]
id = "exhausted-route-parks"
text = "An exhausted subscription route parks the node in NeedsCapacity — wait, not aggressive retry — per the gateway spec."
rationale = "The §12 wait rule as a total mapping: quota-class errors land in NeedsCapacity and only them."

[[clause.prover]]
fn = "capacity_class_errors_park_the_node_and_only_them"
suite = "workspace tests"
assert_fingerprint = "NeedsCapacity"

[[clause]]
id = "full-gate-green"
text = "The full local gate is green, both PostgreSQL locale passes included."
rationale = "Proven by the gate run itself, not by one test: the grounding check pins that the gate script still ends in the GREEN verdict line and still carries both PostgreSQL passes."
gate = true

# The refused scope (D-040): every banned monitor mutation, each citing the decision
# register's own sentence. The grounding check verifies the quoted phrase still appears in
# docs/DECISION_REGISTER.md — the ban stays diff-visible.

[[refused]]
affordance = "an approve button"
citation = "It contains no mutating action: a UI that can mutate is Studio"

[[refused]]
affordance = "a pause button"
citation = "It contains no mutating action: a UI that can mutate is Studio"

[[refused]]
affordance = "a retry button"
citation = "It contains no mutating action: a UI that can mutate is Studio"

[[refused]]
affordance = "a cancel button"
citation = "It contains no mutating action: a UI that can mutate is Studio"
