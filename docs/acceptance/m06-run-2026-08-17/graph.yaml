apiVersion: p50.dev/graph/v1
kind: ExecutionGraph
metadata:
  id: exec_m06_dogfood_v1
  name: M06 dogfood story
  executionId: exec-m06-dogfood
  version: 1
spec:
  entrypoints:
    - prepare
  nodes:
    prepare:
      type: tool
      name: Prepare
      objective: Prove the workspace.
      optionality: required
      input:
        schema: schema://TaskRequest@1
      output:
        schema: schema://TestReport@1
      tool:
        call:
          tool: shell
          program: git
          arguments:
            - status
      completion:
        requires:
          - expression: output.executed > 0
    quality_gate:
      type: gate
      name: Geometry gate
      objective: Refuse a useless delivery.
      optionality: required
      gate: {"check": {"gateId": "gate-geometry", "delivered": {"claims": [{"feature": "node table", "elementId": "nodes-table", "artifact": "monitor-snapshot.html"}, {"feature": "triage list", "elementId": "triage-list", "artifact": "monitor-snapshot.html"}], "html": "<style>body{color:#111;background:#fff}.t{color:#777}</style><a href=\"#nodes-table\">nodes</a><a href=\"#triage-list\">triage</a><section id=\"nodes-table\">node table<table><tr><th>a</th><th>b</th></tr><tr><td>1</td><td>2</td></tr></table></section><section id=\"triage-list\">triage list<ul><li>item</li></ul></section>", "reachableIds": ["nodes-table", "triage-list"], "journey": [{"action": "open monitor", "assertion": "node table renders", "exercisesErrorPath": false}, {"action": "break token", "assertion": "triage list refuses", "exercisesErrorPath": true}], "tests": [{"name": "renders", "passed": true, "assertions": 3}], "diff": {"filesTouched": 2, "behaviorLines": 14}}, "manifest": {"required": [{"marker": "id=\"nodes-table\"", "label": "node table"}, {"marker": "id=\"triage-list\"", "label": "triage list"}]}}}
      completion:
        requires:
          - expression: output.executed > 0
    judge:
      type: evaluator
      name: Blind judge
      objective: Judge usefulness blind.
      optionality: required
      judge: {"judgeId": "judge-usefulness", "userStory": "As an operator I open the monitor and know in one glance whether I can go back to sleep.", "mcpSurface": "the graphhelm MCP server registered in your MCP config (tools: status, events, wake_arm, wake_status, ...); probe execution exec-m06-dogfood"}
      completion:
        requires:
          - expression: output.executed > 0
  edges:
    - id: prepare_to_gate
      from: prepare
      to: quality_gate
      type: data
    - id: gate_to_judge
      from: quality_gate
      to: judge
      type: data
  budgets:
    maxParallelModelCalls: 1
  completion:
    terminalNodes:
      - judge
