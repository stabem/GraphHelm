apiVersion: p50.dev/graph/v1
kind: ExecutionGraph
metadata:
  id: exec_m08_judge_v8
  name: M08 judge story
  executionId: exec-m08-judge8
  version: 1
spec:
  entrypoints:
    - prepare
  nodes:
    prepare:
      type: tool
      name: Prepare
      objective: Prove the workspace.
      optionality: required
      input:
        schema: schema://TaskRequest@1
      output:
        schema: schema://TestReport@1
      tool:
        call:
          tool: shell
          program: git
          arguments:
            - status
      completion:
        requires:
          - expression: output.executed > 0
    flaky_check:
      type: tool
      name: Flaky check
      objective: Fail for real, so the failure has a cause to inspect.
      optionality: optional
      input:
        schema: schema://TaskRequest@1
      output:
        schema: schema://TestReport@1
      tool:
        call:
          tool: shell
          program: git
          arguments:
            - cat-file
            - "-e"
            - deadbeefdeadbeefdeadbeefdeadbeefdeadbeef
      completion:
        requires:
          - expression: output.executed > 0
    judge:
      type: evaluator
      name: Blind judge
      objective: Judge usefulness blind.
      optionality: required
      judge: {"judgeId": "judge-usefulness", "userStory": "As an operator I open the monitor and know in one glance whether I can go back to sleep.", "mcpSurface": "the graphhelm MCP server registered in your MCP config (tools: status, events, wake_arm, wake_status, ...); probe execution exec-m08-judge8"}
      completion:
        requires:
          - expression: output.executed > 0
  edges:
    - id: prepare_to_flaky
      from: prepare
      to: flaky_check
      type: data
    - id: prepare_to_judge
      from: prepare
      to: judge
      type: data
  budgets:
    maxParallelModelCalls: 1
  completion:
    terminalNodes:
      - judge
      - flaky_check
