<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Projects" style="font-family: 'Space Grotesk', system-ui, sans-serif; color: #f5f5f6; font-size: 12px; width: 232px; min-height: 900px; height: 100%; box-sizing: border-box; background: #0f0f11; border-right: 1px solid #2a2a30; padding: 14px 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px">
<img alt="" aria-hidden="true" src="../../../apps/studio-next/public/favicon.png" style="width: 26px; height: 26px; border-radius: 7px; display: block">
<strong style="font-size: 14px">GraphHelm</strong>
<span style="flex: 1"></span>
<span style="color: #3ddc97; font-size: 10px; font-family: 'JetBrains Mono', monospace">● LIVE</span>
</div>

<details style="border: 1px solid #3a2414; border-radius: 10px; background: #1a120c; padding: 8px 10px">
<summary style="cursor: pointer; color: #ff8a3d; font-size: 11px; list-style: none">Runtime restarted 09:47 · Details</summary>
<p style="margin: 6px 0 0; color: #a2a2ad; font-size: 11px; line-height: 1.4">The previous run stopped without recording why. Its agents were released; nothing was lost.</p>
</details>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8a8a96">PROJECTS</span><span style="flex: 1"></span><button aria-label="Add project folder" style="all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 6px; border: 1px solid #2a2a30; text-align: center; line-height: 20px; color: #a2a2ad">+</button></div>

<div style="border-radius: 10px; background: #1e1e22; border: 1px solid #34343c; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f5f5f6" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"></path></svg><strong>zuvemo</strong><span style="flex: 1"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: #3ddc97"></span></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8a8a96">~/code/zuvemo</span>
<div style="display: flex; flex-direction: column; gap: 2px; padding-left: 4px; border-left: 1px solid #34343c; margin-left: 5px">
<span style="padding: 4px 8px; border-radius: 6px; background: #2a2a30">● gh-team · 8 agents</span>
<span style="padding: 4px 8px; color: #a2a2ad">24 journeys · 1 failing</span>
</div>
</div>

<div style="border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; border: 1px solid transparent">
<div style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#a2a2ad" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"></path></svg><span>GraphHelm</span><span style="flex: 1"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: #45454e"></span></div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8a8a96">~/code/GraphHelm · no run</span>
</div>
</div>

<span style="flex: 1"></span>

<div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #2a2a30; padding-top: 10px">
<span style="padding: 6px 8px; border-radius: 6px; color: #a2a2ad">Runtime log</span>
<span style="padding: 6px 8px; border-radius: 6px; color: #a2a2ad">Models</span>
<span style="padding: 6px 8px; border-radius: 6px; color: #a2a2ad">Add project folder</span>
</div>
</nav>
</x-dc>

</html>
