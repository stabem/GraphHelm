apiVersion: p50.dev/graph/v1
kind: ExecutionGraph
metadata:
  id: exec_override_graph_v13
  name: Deploy com override manual
  executionId: exec_override
  version: 13
  basedOn: exec_override_graph_v12
  labels:
    origin: user_graph_draft
    mode: manual
spec:
  entrypoints:
    - implementation
  nodes:
    implementation:
      type: agent
      name: Implementação concluída
      objective: Produzir build implantável.
      optionality: required
      agent:
        ephemeral:
          purpose: Implementar a mudança.
          capabilities:
            - repository.write_patch
          inputSchema: schema://ImplementationPlan@1
          outputSchema: schema://ImplementationResult@1
          instructions: Produza patch e build artifact.
          completionContract:
            requires:
              - build_artifact
          isolationMinimum: tier_1
      completion:
        requires:
          - artifactExists: build.tar
    deploy:
      type: deploy
      name: Deploy
      objective: Implantar no ambiente configurado.
      targetRef: environment://staging
      optionality: required
      input:
        schema: schema://ImplementationResult@1
      output:
        schema: schema://DeploymentReceipt@1
      completion:
        requires:
          - outputSchemaValid: true
      userOverrideAllowed: true
  edges:
    - id: implementation_direct_to_deploy
      from: implementation
      to: deploy
      type: data
  budgets:
    maxNodes: 5
    maxDepth: 3
    maxMutations: 2
    maxRetriesPerNode: 1
    maxWallClockSeconds: 3600
    maxApiCostUsd: 5
    maxParallelModelCalls: 1
  policies:
    - inlineConstraint:
        manualOverride:
          bypassedRequirements:
            - integration_tests
            - independent_security_review
          acknowledgedRisks:
            - untested_regression
            - unreviewed_security_change
          resultLabel: deployed_without_full_validation
  completion:
    terminalNodes:
      - deploy
    allowWaivers: true
