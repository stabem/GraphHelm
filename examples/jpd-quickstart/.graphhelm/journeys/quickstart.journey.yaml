schema: graphhelm.journey-flow/1
id: quickstart
title: Client greets and lists items
purpose: A client is greeted by the service and then sees its items listed.
status: draft
approved: null
base: http://127.0.0.1:8765
actors: [client]
secrets: []
risks: []
screens:
  - id: greeted
    title: The greeting the service answered
    url: /
    state: success
    expect: [{role: exit, name: "0"}, {role: stdout, name: hello}]
    scope: unknown
  - id: listed
    title: The list of items the client asked for
    url: /
    state: success
    expect: [{role: status, name: "200"}, {role: json, name: items.0.name=apple}]
    scope: unknown
  - id: start
    title: The service status before any request
    url: /health.json
    state: stable
    expect: [{role: status, name: "200"}, {role: json, name: status=ok}]
    scope: unknown
edges:
  - id: greet
    from: start
    to: greeted
    acts:
      - {kind: cli, role: exec, name: sh hello.sh}
  - id: list
    from: greeted
    to: listed
    acts:
      - {kind: http, role: GET, name: /items.json}
paths:
  main: [greet, list]
drift: []
