apiVersion: p50.dev/v1
kind: Extension
metadata:
  id: community/playwright-tool
  version: 1.2.0
  publisher: did:key:example
spec:
  type: tool
  capabilities:
    - browser_navigation
    - screenshot_capture
    - dom_inspection
  permissions:
    network: required
    filesystem: optional
    secrets: none
  contracts:
    input: schema://BrowserCommand@1
    output: schema://BrowserArtifact@1
  runtime:
    kind: oci
    image: registry.example/p50/playwright@sha256:example
    isolationMinimum: tier_2
  compatibility:
    framework: ">=0.1 <1.0"
    platforms:
      - linux_amd64
      - linux_arm64
  telemetry:
    external: false
