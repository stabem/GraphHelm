# Retrieval admission policy (#219 / task-003).
#
# The DECLARATIVE record of what core/runtime/src/retrieval.rs enforces. It DESCRIBES the contract
# and is never a second implementation of it: the Runtime is the only enforcer, and a policy file
# readable as authority would be a second place to change behaviour.
#
# The guards in core/runtime/tests/retrieval.rs are what actually hold these rules in place. This
# file is checked against schemas/retrieval-admission-policy.schema.json, which is where the
# closed vocabularies below are enforced rather than merely written down.
apiVersion: p50.dev/development/v1
kind: RetrievalAdmissionPolicy

# A zero from an index is not an absence. It is "the instrument returned nothing", and each
# coverage state is a DIFFERENT reason for that, with a different correct response. Fusing them
# into a boolean destroys exactly the distinction the fallback decision is made on.
#
# All eight states are listed. `unknown` in particular is explicit rather than defaulted: a
# provider that did not say what it covered has not said it covered everything, and silence is the
# one answer that must never be upgraded.
zeroResultAdmission:
  complete: verified-absence          # the only state under which a zero may be published
  stale: refuse:index_stale           # repair is known and specific: reindex
  partial: refuse:negative_claim_unverified
  excluded: refuse:negative_claim_unverified
  skipped: refuse:negative_claim_unverified
  extractionGap: refuse:negative_claim_unverified
  unknown: refuse:negative_claim_unverified
  unresolved: refuse:negative_claim_unverified

boundEnforcement:
  side: runtime
  onExceeded: refuse
  bounds:
    maxResults: refuse:cardinality_violation
    maxBytes: refuse:artifact_too_large
    maxPages: refuse:cardinality_violation
    maxTokens: refuse:artifact_too_large
  measuredFrom: received-payload

pathAdmission:
  requirement: repository-relative
  onEscape: refuse:scope_mismatch
  # ADMISSION IS AN ALLOW-LIST BY FORM, not a deny-list of shapes. The Windows path-semantics class
  # is open-ended (see Microsoft "Naming Files, Paths, and Namespaces"), so the runtime DEFINES the
  # legal form positively and refuses everything else. `refusedShapes` below are ILLUSTRATIVE
  # examples of what the form rejects, not an exhaustive enumeration -- the form is the contract.
  admittedForm:
    lineSuffix: optional-trailing-:<digits>   # index hits carry one; every other colon is refused
    separator: single-forward-slash
    component: "[A-Za-z0-9._-]+"
    componentMustNotBe: ["." , "..", "<ends-with-dot>", "<reserved-DOS-device-stem>"]
  refusedShapes:                              # examples the form excludes, not a closed list
    - parent-traversal    # `..`, and Win32 spellings that normalize to it (`.. `, `...`)
    - rooted              # leading `/` or `\`, an empty first component
    - drive-qualified     # C:/... or C:1 — a `<letter>:` prefix, caught on the raw hit
    - alternate-stream    # any colon that is not the trailing :line — an NTFS ADS selector
    - reserved-device     # a component whose stem is a DOS device (NUL/CON/AUX/PRN/COM1-9/LPT1-9)
    - out-of-charset      # `\`, space, control, non-ASCII, full-width slash, `~`, `$`, `%`, ...
    - empty-component     # `a//b`, a leading or embedded empty segment

providerSummary:
  authority: none

# DECLARED GAPS, stated because a policy listing only what it enforces reads as complete:
#
#   * BOUNDED SOURCE FALLBACK: THE COMPILE-LAYER PATH IS BUILT; THE PRODUCTION PRODUCER AND
#     CONSUMER ARE NOT YET. The acceptance criterion gives non-complete coverage two exits —
#     bounded source fallback OR negative_claim_unverified. The fallback PATH now exists:
#     `compile_plan_composed_against` consults a `BoundedSourceSearch` channel SUPPLIED BY THE
#     CALLER (the channel is injected), and `source_fallback_available()` returns `true` to state
#     that the path exists in the runtime — NOT that a producer is wired. The workspace-backed
#     implementation of the port (`WorkspaceSourceChannel`) LANDED with #622. What is still not on
#     the main branch: the production CONSUMER that calls `compile_plan*`, tracked in #724
#     (#223/#224 closed without it, see #722). Until it lands, non-complete states still refuse in
#     practice because no production caller injects a channel — `extractionGap` is where it matters
#     most, its repair being to read the source. A ZERO-hit non-complete response never reaches the
#     channel regardless: `compile_plan` maps empty+non-complete to `negative_claim_unverified`
#     before composition.
#     A guard pins the flag: the ExtractionGap arm asserts source_fallback_available() is `true`
#     (the path exists), so removing the compile-layer path turns that arm RED.
#
#   * CAPABILITY RECEIPTS ARE NOT AN INPUT. The acceptance criterion names determinism over
#     "identical inputs AND capability receipts" — two variables. Only the first is exercised here:
#     the snapshot binding is permuted, but a snapshot binding is not a capability receipt. Receipts
#     belong to the Tool Broker lease path and arrive with #213; nothing in this lane consumes them.
#     Listed because the other gaps were declared with care and this one was not, and a reader of a
#     list like this concludes that whatever is absent from it is done. (Found by L.)
#
#     (Re-measured 2026-08-24: canonical determinism and all four bounds ARE guarded. An earlier
#     version of this block listed them as gaps and was already false when the PR was read -- a
#     declaration of what is not proven ages like any other claim, and nothing goes red when it does.)
