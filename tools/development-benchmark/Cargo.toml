[package]
name = "graphhelm-development-benchmark"
default-run = "graphhelm-development-benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sha2.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
graphhelm-protocols = { path = "../../core/protocols" }
graphhelm-runtime = { path = "../../core/runtime" }
graphhelm-gateway = { path = "../../core/gateway" }
graphhelm-model-gateway = { path = "../../adapters/model-gateway" }
graphhelm-events = { path = "../../core/events" }
# generate-retrieval only: the contained session (verified executable, pinned snapshot, Tier 1
# workspace) is the ONLY door this repository speaks to an index provider through -- the
# generator rides it rather than growing a second, unconfined spawn path.
graphhelm-tool-host = { path = "../../adapters/tool-host" }
graphhelm-tool-broker = { path = "../../core/tool-broker" }
# rt only: the broker's open/lease are async and the driver bridges with a current-thread
# block_on exactly as apps/cli/src/commands/gateway/probe.rs does.
tokio = { workspace = true, features = ["rt"] }
zeroize.workspace = true
serde_yaml_ng.workspace = true

[dev-dependencies]
tempfile.workspace = true


[[bin]]
name = "graphhelm-development-benchmark"
path = "src/main.rs"

[[bin]]
name = "paired-driver"
path = "src/bin/paired-driver.rs"

[[bin]]
name = "generate-retrieval"
path = "src/bin/generate-retrieval.rs"

[[bin]]
name = "fake-index-provider"
path = "src/bin/fake-index-provider.rs"
