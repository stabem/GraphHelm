[package]
name = "keel-contract-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
same-file = "=1.0.6"
syn = { version = "=2.0.119", features = ["full", "parsing", "visit"] }
oxc_allocator = "=0.151.0"
oxc_ast = "=0.151.0"
oxc_parser = "=0.151.0"
oxc_span = "=0.151.0"
tempfile = "=3.27.0"
uuid.workspace = true

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
