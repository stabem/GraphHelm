[package]
name = "keel-contract-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
clap = { version = "=4.6.4", features = ["derive"] }
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", features = ["zeroize"] }
same-file = "=1.0.6"
syn = { version = "=2.0.119", features = ["full", "parsing", "visit"] }
tempfile = "=3.27.0"

[dev-dependencies]
assert_cmd = "=2.2.2"
predicates = "=3.1.4"
